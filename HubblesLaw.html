<div class="container" id="main"><header><h1>哈勃定律 / Hubble's Law</h1></header>

tyle="font-size:.78rem;color:#6B6B6B">哈勃常数的倒数给出宇宙年龄的数量级估计。</div></div></div></div></div></section></div>
<script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');const sD=document.getElementById('slider-d');const bD=document.getElementById('badge-d');const resV=document.getElementById('res-v'),resD=document.getElementById('res-d');const fRoot=document.getElementById('formula-root');const H0=70;const S={d:100,galaxies:[]};
function initGalaxies(){S.galaxies=[];for(let i=1;i<=12;i++){S.galaxies.push({r:30+i*25,angle:Math.random()*Math.PI*2,color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0')})}}
initGalaxies();function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}window.addEventListener('resize',resize);
function update(){S.d=parseFloat(sD.value);bD.textContent=S.d+' Mpc';const v=H0*S.d;resV.textContent=v.toFixed(0);resD.textContent=S.d;fRoot.innerHTML=`<span style="font-size:26px;font-weight:700;color:var(--accent)">v</span><span style="font-size:26px">=</span><span style="font-size:26px;font-weight:700;color:#3498db">H₀</span><span style="font-size:26px;font-weight:700;color:#9b59b6">·d</span><span style="font-size:26px">=</span><span style="font-size:26px">70 × ${S.d}</span><span style="font-size:26px;font-weight:700;color:var(--accent)">= ${v.toFixed(0)} km/s</span>`;draw(v);requestAnimationFrame(update)}
function draw(v){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,w,h);for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+Math.random()*0.5)+')';ctx.fillRect(Math.random()*w,Math.random()*h,1.5,1.5)}const scale=S.d/100;S.galaxies.forEach(g=>{const r=g.r*scale;const px=w/2+r*Math.cos(g.angle),py=h/2+r*Math.sin(g.angle);ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 8px';ctx.textAlign='center';ctx.fillText((H0*r/10).toFixed(0)+'km/s',px,py-10)});ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(w/2,h/2,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px';ctx.textAlign='center';ctx.fillText('银河系',w/2,h/2+4);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 13px ';ctx.fillText('v = H₀·d = '+v.toFixed(0)+' km/s',w/2,h-20)}
document.getElementById('btn-reset').onclick=()=>{sD.value=100;S.d=100};
resize();requestAnimationFrame(update);
