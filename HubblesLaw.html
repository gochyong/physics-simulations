<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>哈勃定律 / Hubble's Law - Wuli布雷克</title><link rel="stylesheet" href="common.css"><meta name="author" content="Wuli布雷克"><meta name="copyright" content="Copyright 2025 Wuli布雷克"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet"><style>:root{--bg-color:#FFF9F0;--primary:#FF8c42;--accent:#FF5E5B;--text-dark:#4A403A;--shadow:0 6px 30px rgba(255,140,66,0.18)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Fredoka','Noto Sans SC',sans-serif;background:var(--bg-color);color:var(--text-dark);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:5px 40px 10px}.container{width:100%;max-width:1400px;margin-top:8px;display:grid;grid-template-areas:"header header""formula formula""diagram controls";grid-template-columns:1fr 400px;gap:12px}header{grid-area:header;text-align:center}h1{font-size:2rem}.formula-display{grid-area:formula;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px 20px;display:flex;flex-direction:column;align-items:center;border:2px solid #fff5eb}.formula-container{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:44px}.result-row{font-size:.95rem;font-weight:600;margin-top:4px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}.diagram-section{grid-area:diagram;background:#1a1a2e;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-height:420px;display:flex;flex-direction:column;border:2px solid #fff5eb}#simCanvas{width:100%;flex:1;display:block}.controls-section{grid-area:controls;display:flex;flex-direction:column;gap:10px}.control-panel{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px}.control-group{display:flex;flex-direction:column;gap:3px}.label-row{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem}.val-badge{background:#fff;padding:1px 7px;border-radius:7px;font-size:.85rem;border:2px solid #f0f0f0}input[type=range]{width:100%;appearance:none;height:6px;background:#eee;border-radius:3px}input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer}.btn-row{display:grid;grid-template-columns:1fr;gap:8px}.ctrl-btn{padding:10px;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff}.reset{background:#95a5a6}.info-card{background:#fff;border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);font-size:.9rem;line-height:1.4;color:#5D6D7E}@media(max-width:1100px){.container{grid-template-areas:"header""formula""diagram""controls";grid-template-columns:1fr}}</style></head><body>

<div class="container"><header><h1>哈勃定律 / Hubble's Law</h1></header>
<section class="formula-display"><div class="formula-container" id="formula-root"></div><div class="result-row"><span>v = <strong style="color:var(--accent)" id="res-v">—</strong> km/s</span><span>d = <strong style="color:#9b59b6" id="res-d">—</strong> Mpc</span></div></section>
<section class="diagram-section"><canvas id="simCanvas"></canvas></section>
<section class="controls-section"><div class="control-panel">
<div class="control-group"><div class="label-row"><span style="color:#9b59b6">距离 d</span><span id="badge-d" class="val-badge">100 Mpc</span></div><input type="range" id="slider-d" min="10" max="500" step="10" value="100"></div>
<div class="btn-row"><button id="btn-reset" class="ctrl-btn reset">重置 Reset</button></div></div>
<div class="info-card"><div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:1.1rem">演示要点 / Key Points</div><div style="display:flex;flex-direction:column;gap:6px"><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,140,66,0.1);color:var(--primary);font-weight:700">v</div><div><div style="font-weight:700;font-size:.9rem">v = H₀·d</div><div style="font-size:.78rem;color:#888">星系退行速度与距离成正比。H₀≈70 km/s/Mpc。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(155,89,182,0.1);color:#9b59b6;font-weight:700">↔</div><div><div style="font-weight:700;font-size:.9rem">距离越远退行越快</div><div style="font-size:.78rem;color:#888">越远的星系红移越大，光谱向长波方向移动。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(46,204,113,0.1);color:#2ecc71;font-weight:700">∞</div><div><div style="font-weight:700;font-size:.9rem">宇宙膨胀的证据</div><div style="font-size:.78rem;color:#888">哈勃发现几乎所有的星系都在远离我们，是宇宙大爆炸理论的关键证据。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(230,126,34,0.1);color:#e67e22;font-weight:700">t</div><div><div style="font-weight:700;font-size:.9rem">宇宙年龄≈1/H₀≈138亿年</div><div style="font-size:.78rem;color:#888">哈勃常数的倒数给出宇宙年龄的数量级估计。</div></div></div></div></div></section></div>
<script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');const sD=document.getElementById('slider-d');const bD=document.getElementById('badge-d');const resV=document.getElementById('res-v'),resD=document.getElementById('res-d');const fRoot=document.getElementById('formula-root');const H0=70;const S={d:100,galaxies:[]};
function initGalaxies(){S.galaxies=[];for(let i=1;i<=12;i++){S.galaxies.push({r:30+i*25,angle:Math.random()*Math.PI*2,color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0')})}}
initGalaxies();function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}window.addEventListener('resize',resize);
function update(){S.d=parseFloat(sD.value);bD.textContent=S.d+' Mpc';const v=H0*S.d;resV.textContent=v.toFixed(0);resD.textContent=S.d;fRoot.innerHTML=`<span style="font-size:26px;font-weight:700;color:var(--accent)">v</span><span style="font-size:26px">=</span><span style="font-size:26px;font-weight:700;color:#3498db">H₀</span><span style="font-size:26px;font-weight:700;color:#9b59b6">·d</span><span style="font-size:26px">=</span><span style="font-size:26px">70 × ${S.d}</span><span style="font-size:26px;font-weight:700;color:var(--accent)">= ${v.toFixed(0)} km/s</span>`;draw(v);requestAnimationFrame(update)}
function draw(v){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,w,h);for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+Math.random()*0.5)+')';ctx.fillRect(Math.random()*w,Math.random()*h,1.5,1.5)}const scale=S.d/100;S.galaxies.forEach(g=>{const r=g.r*scale;const px=w/2+r*Math.cos(g.angle),py=h/2+r*Math.sin(g.angle);ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 8px';ctx.textAlign='center';ctx.fillText((H0*r/10).toFixed(0)+'km/s',px,py-10)});ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(w/2,h/2,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px';ctx.textAlign='center';ctx.fillText('银河系',w/2,h/2+4);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 13px Fredoka';ctx.fillText('v = H₀·d = '+v.toFixed(0)+' km/s',w/2,h-20)}
document.getElementById('btn-reset').onclick=()=>{sD.value=100;S.d=100};
resize();requestAnimationFrame(update);
</script><div class="site-footer">© 2025 Wuli布雷克 | MIT License </div></body></html>
