<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>近代物理 / Modern Physics - Wuli布雷克</title>
    <style>
        :root {
            --bg-color: #fffaf5;
            --primary-warm: #ff9800;
            --accent-warm: #f57c00;
            --text-main: #3e2723;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Back link */
        .back-link {
            position: absolute;
            top: 20px;
            left: 30px;
            text-decoration: none;
            color: var(--accent-warm);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(245, 124, 0, 0.08);
            transition: all 0.25s ease;
        }

        .back-link:hover {
            background: rgba(245, 124, 0, 0.18);
            transform: translateX(-3px);
        }

        /* Header */
        header {
            width: 100%;
            padding: 40px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-main {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-warm), var(--primary-warm));
            padding: 10px 25px;
            border-radius: 15px 15px 15px 0;
            box-shadow: 5px 5px 20px rgba(245, 124, 0, 0.2);
        }

        .logo-sub {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--accent-warm);
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .page-heading {
            text-align: center;
            margin: 10px 0 30px;
        }

        .page-heading h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            letter-spacing: 2px;
        }

        .page-heading .heading-sub {
            font-size: 1rem;
            color: #795548;
            margin-top: 6px;
            font-style: italic;
        }

        /* Sim Card Grid */
        .sim-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 90%;
            max-width: 1100px;
            padding: 20px 0 50px;
        }

        .sim-card {
            text-decoration: none;
            color: var(--text-main);
            background: var(--card-bg);
            border-radius: 24px;
            padding: 35px 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .sim-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-radius: 0 0 4px 4px;
        }

        .sim-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.15);
            border-color: rgba(245, 124, 0, 0.3);
        }

        .sim-icon {
            font-size: 3rem;
            margin-bottom: 14px;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.1));
        }

        .sim-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 2px;
            color: #3e2723;
        }

        .sim-subtitle {
            font-size: 0.85rem;
            color: #8d6e63;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .sim-desc {
            font-size: 0.9rem;
            color: #795548;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .tag {
            display: inline-block;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: #fff;
            padding: 4px 14px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 40px;
            font-size: 0.85rem;
            color: #a1887f;
        }

        @media (max-width: 800px) {
            .sim-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .sim-card {
                padding: 28px 18px 24px;
            }

            .sim-title {
                font-size: 1.15rem;
            }

            .sim-icon {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .sim-grid {
                grid-template-columns: 1fr;
            }

            .back-link {
                top: 12px;
                left: 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-link">&#8592; 返回首页</a>

    <header>
        <div class="brand-logo">
            <div class="logo-main">Wuli布雷克</div>
            <div class="logo-sub">Physics Simulation Lab</div>
        </div>
        <div class="page-heading">
            <h1>近代物理 / Modern Physics</h1>
            <div class="heading-sub">探索原子核与量子世界的奥秘</div>
        </div>
    </header>

    <main class="sim-grid">

        <a href="AlphaScattering.html" class="sim-card">
            <div class="sim-icon">🔬</div>
            <div class="sim-title">卢瑟福散射</div>
            <div class="sim-subtitle">Rutherford Scattering</div>
            <div class="sim-desc">α粒子散射实验模拟，探索原子核结构。</div>
            <span class="tag">近代物理 / Modern Physics</span>
        </a>

    </main>

    <footer>
        &copy; 2025 Wuli布雷克 | 由 HTML5 &amp; CSS3 驱动
    </footer>

</body>

</html>
