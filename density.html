<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Wuli布雷克">
    <meta name="copyright" content="Copyright 2025 Wuli布雷克">
    <title>密度 / Density - Wuli布雷克</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF9F0; --primary: #FF8c42; --secondary: #FFC75F;
            --accent: #FF5E5B; --text-dark: #4A403A; --card-bg: #FFFFFF;
            --shadow: 0 6px 30px rgba(255,140,66,0.18);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka','Noto Sans SC',sans-serif; background: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 5px 40px 10px; }
        .branding { position: fixed; top: 10px; left: 20px; z-index: 1000; }
        .logo { font-weight: 700; font-size: 1.3rem; color: #fff; background: var(--primary); padding: 6px 18px; border-radius: 16px; box-shadow: 4px 4px 15px rgba(255,140,66,0.3); }
        .container { width: 100%; max-width: 1400px; margin-top: 8px; display: grid; grid-template-areas:"header header" "formula formula" "diagram controls"; grid-template-columns: 1fr 400px; gap: 12px; }
        header { grid-area: header; text-align: center; }
        h1 { font-size: 2rem; color: var(--text-dark); margin-bottom: 2px; }
        .formula-display { grid-area: formula; background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 10px 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #fff5eb; }
        .formula-container { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; min-height: 50px; }
        .result-row { font-size: 1rem; font-weight: 600; margin-top: 6px; display: flex; gap: 20px; justify-content: center; }
        .legend { display: flex; gap: 16px; justify-content: center; border-top: 1px solid #eee; padding-top: 6px; width: 100%; flex-wrap: wrap; }
        .legend-item { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .diagram-section { grid-area: diagram; background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; min-height: 320px; display: flex; flex-direction: column; border: 2px solid #fff5eb; }
        #simCanvas { width: 100%; flex: 1; display: block; }
        .controls-section { grid-area: controls; display: flex; flex-direction: column; gap: 10px; }
        .control-panel { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 3px; }
        .label-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .val-badge { background: #fff; padding: 1px 7px; border-radius: 7px; font-size: 0.85rem; border: 2px solid #f0f0f0; }
        input[type=range] { width: 100%; appearance: none; height: 6px; background: #eee; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; background: var(--primary); }
        #m-slider::-webkit-slider-thumb { background: #3498db; }
        #v-slider::-webkit-slider-thumb { background: #b58900; }
        .info-card { background: #fff; border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 0.9rem; line-height: 1.4; color: #5D6D7E; }
        .material-tag { display: inline-block; background: rgba(255,140,66,0.1); color: var(--primary); padding: 4px 14px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; }
        @media(max-width:1100px){.container{grid-template-areas:"header" "formula" "diagram" "controls";grid-template-columns:1fr}}
    </style>
</head>

<body>
    <div class="branding"><div class="logo">Wuli布雷克</div></div>
    <div class="container">
        <header style="display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;">
    <h1 style="margin:0;">密度 / Density</h1>
    <a href="https://space.bilibili.com/38890347/lists/7051429?type=season" target="_blank" rel="noopener"
       style="display:inline-flex;align-items:center;gap:4px;background:#FB7299;color:#fff;padding:4px 14px;border-radius:14px;font-size:0.85rem;font-weight:600;text-decoration:none;transition:all 0.2s;box-shadow:0 2px 8px rgba(251,114,153,0.3);"
       onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
       📺 视频讲解
    </a>
</header>

        <section class="formula-display">
            <div class="formula-container" id="formula-root"></div>
            <div class="result-row">
                <span>密度 ρ = <strong id="res-rho" style="color:var(--primary)">1.000</strong> g/cm³</span>
                <span id="match-tag" class="material-tag" style="display:none"></span>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:#3498db"></span> 质量 m (g)</div>
                <div class="legend-item"><span class="legend-dot" style="background:#b58900"></span> 体积 V (cm³)</div>
                <div class="legend-item"><span class="legend-dot" style="background:var(--primary)"></span> 密度 ρ (g/cm³)</div>
            </div>
        </section>

        <section class="diagram-section"><canvas id="simCanvas"></canvas></section>

        <section class="controls-section">
            <div class="control-panel">
                <div class="control-group">
                    <div class="label-row"><span style="color:#3498db">质量 m / Mass</span><span id="m-badge" class="val-badge">1000 g</span></div>
                    <input type="range" id="m-slider" min="1" max="5000" value="1000">
                </div>
                <div class="control-group">
                    <div class="label-row"><span style="color:#b58900">体积 V / Volume</span><span id="v-badge" class="val-badge">1000 cm³</span></div>
                    <input type="range" id="v-slider" min="10" max="2000" value="1000">
                </div>
            </div>
            <div class="info-card">
                <div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:1.1rem">演示要点 / Key Points</div>
                <div style="display:flex;flex-direction:column;gap:6px">
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,140,66,0.1);color:var(--primary);font-weight:700">ρ</div>
                        <div><div style="font-weight:700;font-size:0.9rem">ρ = m / V</div><div style="font-size:0.78rem;color:#888">密度等于质量除以体积，相同质量下体积越小密度越大。</div></div>
                    </div>
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(52,152,219,0.1);color:#3498db;font-weight:700">m</div>
                        <div><div style="font-weight:700;font-size:0.9rem">方块中粒子数代表质量</div><div style="font-size:0.78rem;color:#888">粒子越多 = 质量越大，粒子密度 = 物体密度。</div></div>
                    </div>
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(181,137,0,0.1);color:#b58900;font-weight:700">V</div>
                        <div><div style="font-weight:700;font-size:0.9rem">方块尺寸代表体积</div><div style="font-size:0.78rem;color:#888">方块边长 ∝ ³√V，视觉上直观感受体积变化。</div></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas'), ctx = canvas.getContext('2d');
        const sM = document.getElementById('m-slider'), sV = document.getElementById('v-slider');
        const bM = document.getElementById('m-badge'), bV = document.getElementById('v-badge');
        const resRho = document.getElementById('res-rho'), matchTag = document.getElementById('match-tag');
        const fRoot = document.getElementById('formula-root');

        const materials = [
            { name: "气凝胶 Aerogel", d: 0.003, r: 0.01 }, { name: "软木 Cork", d: 0.24, r: 0.05 },
            { name: "松木 Pine", d: 0.5, r: 0.05 }, { name: "锂 Lithium", d: 0.53, r: 0.02 },
            { name: "冰 Ice", d: 0.92, r: 0.02 }, { name: "纯水 Water", d: 1.0, r: 0.01 },
            { name: "镁 Magnesium", d: 1.74, r: 0.05 }, { name: "铝 Aluminum", d: 2.7, r: 0.1 },
            { name: "钛 Titanium", d: 4.5, r: 0.1 }, { name: "铁 Iron", d: 7.87, r: 0.2 },
            { name: "铜 Copper", d: 8.96, r: 0.2 }, { name: "银 Silver", d: 10.5, r: 0.2 },
            { name: "汞 Mercury", d: 13.6, r: 0.3 }, { name: "金 Gold", d: 19.3, r: 0.3 },
            { name: "铂 Platinum", d: 21.4, r: 0.3 }, { name: "锇 Osmium", d: 22.59, r: 0.4 }
        ];

        function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
        window.addEventListener('resize', () => { resize(); update(); });

        function update() {
            const m = parseFloat(sM.value), v = parseFloat(sV.value), rho = m / v;
            bM.textContent = m + ' g'; bV.textContent = v + ' cm³'; resRho.textContent = rho.toFixed(3);

            const mFS = Math.min(80, Math.max(22, 28 + (m / 5000) * 50));
            const vFS = Math.min(80, Math.max(22, 28 + (v / 2000) * 50));
            const rFS = Math.min(90, Math.max(24, 32 + (rho / 12) * 45));

            fRoot.innerHTML = `
                <span style="color:var(--primary);font-size:${rFS}px;font-weight:700;line-height:1;">ρ</span>
                <span style="font-size:26px;color:#ccc;">=</span>
                <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
                    <span style="color:#3498db;font-size:${mFS}px;font-weight:700;line-height:1;">m</span>
                    <div style="width:60px;height:3px;background:#ccc;border-radius:2px;"></div>
                    <span style="color:#b58900;font-size:${vFS}px;font-weight:700;line-height:1;">V</span>
                </div>
                <span style="font-size:20px;color:#999;">ρ = m/V = ${rho.toFixed(3)} g/cm³</span>
            `;

            draw(m, v, rho);
            let match = materials.find(mat => Math.abs(rho - mat.d) <= mat.r);
            if (match) { matchTag.textContent = '匹配: ' + match.name; matchTag.style.display = 'inline-block'; }
            else matchTag.style.display = 'none';
        }

        function rhoColor(rho) {
            if (rho < 1) return 'rgba(38,139,210,0.8)';
            if (rho < 10) return 'rgba(181,137,0,0.8)';
            return 'rgba(220,50,47,0.9)';
        }

        function draw(m, v, rho) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const side = Math.pow(v, 1 / 3) * 35;
            const x = (canvas.width - side) / 2, y = (canvas.height - side) / 2;

            ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.strokeStyle = rhoColor(rho); ctx.lineWidth = 3;
            ctx.fillRect(x, y, side, side); ctx.strokeRect(x, y, side, side);

            const n = Math.min(m, 4000); ctx.fillStyle = rhoColor(rho);
            let seed = 42;
            function sr() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
            for (let i = 0; i < n; i++) {
                const px = x + sr() * side, py = y + sr() * side;
                ctx.beginPath();
                ctx.arc(px, py, Math.max(0.5, Math.min(2.5, rho * 0.4)), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        sM.addEventListener('input', update); sV.addEventListener('input', update);
        resize(); update();
    </script>
<div style="text-align:center;padding:20px;font-size:0.8rem;color:#a1887f;margin-top:auto;">© 2025 Wuli布雷克 | MIT License </div>
</body>
</html>
