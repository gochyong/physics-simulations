<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天文 / Astronomy - Wuli布雷克</title>
    <style>
        :root {
            --bg-color: #fffaf5;
            --primary-warm: #ff9800;
            --accent-warm: #f57c00;
            --text-main: #3e2723;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Back link */
        .back-link {
            position: absolute;
            top: 20px;
            left: 30px;
            text-decoration: none;
            color: var(--accent-warm);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--primary-warm);
        }

        /* Header */
        header {
            width: 100%;
            padding: 40px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-main {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-warm), var(--primary-warm));
            padding: 10px 25px;
            border-radius: 15px 15px 15px 0;
            box-shadow: 5px 5px 20px rgba(245, 124, 0, 0.2);
        }

        .logo-sub {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--accent-warm);
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Placeholder section */
        .placeholder-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            width: 90%;
        }

        .placeholder-emoji {
            font-size: 6rem;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .placeholder-heading {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .placeholder-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-warm), var(--accent-warm));
            border-radius: 2px;
            margin: 16px 0 20px;
        }

        .placeholder-message {
            font-size: 1.1rem;
            color: #795548;
            line-height: 1.8;
        }

        .placeholder-message .en {
            display: block;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 6px;
            font-style: italic;
        }

        /* Card hint */
        .card-hint {
            margin-top: 40px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(245, 124, 0, 0.1);
        }

        .card-hint p {
            margin: 0;
            color: #8d6e63;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .card-hint strong {
            color: var(--accent-warm);
        }

        footer {
            margin-top: auto;
            padding: 40px;
            font-size: 0.85rem;
            color: #a1887f;
        }

        @media (max-width: 480px) {
            .back-link {
                top: 12px;
                left: 16px;
                font-size: 0.85rem;
            }
            .logo-main {
                font-size: 1.6rem;
                padding: 8px 18px;
            }
            .placeholder-emoji {
                font-size: 4rem;
            }
            .placeholder-heading {
                font-size: 1.6rem;
            }
            .placeholder-message {
                font-size: 1rem;
            }
            .card-hint {
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-link">← 返回首页</a>

    <header>
        <div class="brand-logo">
            <div class="logo-main">Wuli布雷克</div>
            <div class="logo-sub">Physics Simulation Lab</div>
        </div>
    </header>

    <section class="placeholder-section">
        <div class="placeholder-emoji">🌌</div>
        <h1 class="placeholder-heading">天文 / Astronomy</h1>
        <div class="placeholder-divider"></div>
        <div class="placeholder-message">
            内容开发中，敬请期待。
            <span class="en">New simulations coming soon.</span>
        </div>

        <div class="card-hint">
            <p>
                正在准备 <strong>天体力学、轨道模拟、太阳系探索</strong> 等交互式天文模拟。<br>
                <span style="font-size: 0.85rem; opacity: 0.7;">
                    Interactive astronomy simulations on celestial mechanics,
                    orbital dynamics, and solar system exploration are in the works.
                </span>
            </p>
        </div>
    </section>

    <footer>
        © 2025 Wuli布雷克 | 由 HTML5 & CSS3 驱动
    </footer>

</body>

</html>
