<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>压强 / Pressure - Wuli布雷克</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF9F0; --primary: #FF8c42; --secondary: #FFC75F;
            --accent: #FF5E5B; --text-dark: #4A403A; --card-bg: #FFFFFF;
            --shadow: 0 6px 30px rgba(255,140,66,0.18);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka','Noto Sans SC',sans-serif; background: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 5px 40px 10px; }
        .branding { position: fixed; top: 10px; left: 20px; z-index: 1000; }
        .logo { font-weight: 700; font-size: 1.3rem; color: #fff; background: var(--primary); padding: 6px 18px; border-radius: 16px; box-shadow: 4px 4px 15px rgba(255,140,66,0.3); }
        .container { width: 100%; max-width: 1400px; margin-top: 8px; display: grid; grid-template-areas:"header header" "formula formula" "diagram controls"; grid-template-columns: 1fr 400px; gap: 12px; }
        header { grid-area: header; text-align: center; }
        h1 { font-size: 2rem; color: var(--text-dark); margin-bottom: 2px; }
        .formula-display { grid-area: formula; background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 10px 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #fff5eb; }
        .formula-container { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; min-height: 70px; }
        .result-row { font-size: 1rem; font-weight: 600; margin-top: 6px; display: flex; gap: 20px; justify-content: center; }
        .legend { display: flex; gap: 16px; justify-content: center; border-top: 1px solid #eee; padding-top: 6px; width: 100%; flex-wrap: wrap; }
        .legend-item { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .diagram-section { grid-area: diagram; background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; min-height: 320px; display: flex; flex-direction: column; border: 2px solid #fff5eb; }
        #simCanvas { width: 100%; flex: 1; display: block; }
        .controls-section { grid-area: controls; display: flex; flex-direction: column; gap: 10px; }
        .control-panel { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 3px; }
        .label-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .val-badge { background: #fff; padding: 1px 7px; border-radius: 7px; font-size: 0.85rem; border: 2px solid #f0f0f0; }
        input[type=range] { width: 100%; appearance: none; height: 6px; background: #eee; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; background: var(--primary); }
        #f-slider::-webkit-slider-thumb { background: #3498db; }
        #s-slider::-webkit-slider-thumb { background: #b58900; }
        .info-card { background: #fff; border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 0.9rem; line-height: 1.4; color: #5D6D7E; }
        @media(max-width:1100px){.container{grid-template-areas:"header" "formula" "diagram" "controls";grid-template-columns:1fr}}
    </style>
</head>

<body>
    <div class="branding"><div class="logo">Wuli布雷克</div></div>
    <div class="container">
        <header><h1>压强 / Pressure</h1></header>

        <section class="formula-display">
            <div class="formula-container" id="formula-root"></div>
            <div class="result-row">
                <span>压强 P = <strong id="res-p" style="color:var(--accent)">0.50</strong> N/cm² (×10⁴ Pa)</span>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:#3498db"></span> 压力 F (N)</div>
                <div class="legend-item"><span class="legend-dot" style="background:#b58900"></span> 面积 S (cm²)</div>
                <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span> 压强 P</div>
            </div>
        </section>

        <section class="diagram-section"><canvas id="simCanvas"></canvas></section>

        <section class="controls-section">
            <div class="control-panel">
                <div class="control-group">
                    <div class="label-row"><span style="color:#3498db">压力 F / Force</span><span id="f-badge" class="val-badge">50 N</span></div>
                    <input type="range" id="f-slider" min="10" max="200" value="50">
                </div>
                <div class="control-group">
                    <div class="label-row"><span style="color:#b58900">受力面积 S / Area</span><span id="s-badge" class="val-badge">100 cm²</span></div>
                    <input type="range" id="s-slider" min="40" max="250" value="100">
                </div>
            </div>
            <div class="info-card">
                <div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:1.1rem">演示要点 / Key Points</div>
                <div style="display:flex;flex-direction:column;gap:6px">
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,94,91,0.1);color:var(--accent);font-weight:700">P</div>
                        <div><div style="font-weight:700;font-size:0.9rem">P = F / S</div><div style="font-size:0.78rem;color:#888">压强等于压力除以受力面积，压力越大或面积越小，压强越大。</div></div>
                    </div>
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(52,152,219,0.1);color:#3498db;font-weight:700">F</div>
                        <div><div style="font-weight:700;font-size:0.9rem">重力箭头代表压力</div><div style="font-size:0.78rem;color:#888">箭头越长表示压力越大，方块颜色越深表示受力越大。</div></div>
                    </div>
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(181,137,0,0.1);color:#b58900;font-weight:700">S</div>
                        <div><div style="font-weight:700;font-size:0.9rem">方块宽度代表受力面积</div><div style="font-size:0.78rem;color:#888">面积越小（越尖锐），表面形变越明显，压强大。</div></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas'), ctx = canvas.getContext('2d');
        const fSlider = document.getElementById('f-slider'), sSlider = document.getElementById('s-slider');
        const fBadge = document.getElementById('f-badge'), sBadge = document.getElementById('s-badge');
        const resP = document.getElementById('res-p'), fRoot = document.getElementById('formula-root');

        function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; update(); }
        window.addEventListener('resize', () => { resize(); update(); });

        function update() {
            const f = parseFloat(fSlider.value), s = parseFloat(sSlider.value);
            const p = f / s * 10000;

            fBadge.textContent = f + ' N'; sBadge.textContent = s + ' cm²';
            resP.textContent = (f / s).toFixed(2);

            const fFS = Math.min(80, Math.max(22, 28 + (f / 200) * 50));
            const sFS = Math.min(80, Math.max(22, 28 + (s / 250) * 50));
            const pFS = Math.min(90, Math.max(24, 32 + Math.min(p / 10000 * 45, 50)));

            fRoot.innerHTML = `
                <span style="color:var(--accent);font-size:${pFS}px;font-weight:700;line-height:1;">P</span>
                <span style="font-size:26px;color:#ccc;">=</span>
                <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
                    <span style="color:#3498db;font-size:${fFS}px;font-weight:700;line-height:1;">F</span>
                    <div style="width:60px;height:3px;background:#ccc;border-radius:2px;"></div>
                    <span style="color:#b58900;font-size:${sFS}px;font-weight:700;line-height:1;">S</span>
                </div>
                <span style="font-size:20px;color:#999;">P = F/S = ${(f/s).toFixed(2)} N/cm²</span>
            `;

            draw(f, s, p);
        }

        function draw(f, s, p) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const groundY = centerY + 100;

            const sag = Math.min(p / 10000 * 60, 60);
            const areaWidth = s * 1.5;

            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(centerX - areaWidth / 2 - 50, groundY);
            ctx.bezierCurveTo(
                centerX - areaWidth / 2, groundY,
                centerX - areaWidth / 4, groundY + sag,
                centerX, groundY + sag
            );
            ctx.bezierCurveTo(
                centerX + areaWidth / 4, groundY + sag,
                centerX + areaWidth / 2, groundY,
                centerX + areaWidth / 2 + 50, groundY
            );
            ctx.lineTo(canvas.width, groundY);
            ctx.strokeStyle = '#93a1a1';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fillStyle = '#e5dec1';
            ctx.fill();

            const boxHeight = 100;
            const boxX = centerX - areaWidth / 2;
            const boxY = groundY + sag - boxHeight;

            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(boxX + 5, boxY + 5, areaWidth, boxHeight);

            const colorIntensity = Math.floor(160 - (f / 200) * 60);
            ctx.fillStyle = `rgb(${colorIntensity}, ${colorIntensity - 30}, ${colorIntensity - 60})`;
            ctx.fillRect(boxX, boxY, areaWidth, boxHeight);

            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, areaWidth, boxHeight);

            const arrowLen = 20 + (f / 200) * 80;
            drawArrow(centerX, boxY + 30, centerX, boxY + 30 + arrowLen, '#268bd2', `F = ${f}N`);
        }

        function drawArrow(x1, y1, x2, y2, color, label) {
            const headlen = 10;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen, y2 - headlen);
            ctx.lineTo(x2 + headlen, y2 - headlen);
            ctx.fillStyle = color;
            ctx.fill();

            ctx.fillStyle = color;
            ctx.font = 'bold 14px Fredoka, "Noto Sans SC", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, x1, y1 - 10);
        }

        fSlider.addEventListener('input', update);
        sSlider.addEventListener('input', update);

        resize();
    </script>
</body>
</html>
