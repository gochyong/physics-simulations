<div class="container" id="main"><header><h1>太阳系模型 / Solar System Model</h1></header>

<div class="info-card"><div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:1.1rem">演示要点 / Key Points</div><div style="display:flex;flex-direction:column;gap:6px"><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,140,66,0.1);color:var(--primary);font-weight:700">☀</div><div><div style="font-weight:700;font-size:.9rem">八大行星绕太阳公转</div><div style="font-size:.78rem;color:#6B6B6B">水金地火木土天海，近太阳公转快，远太阳公转慢。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(52,152,219,0.1);color:#3498db;font-weight:700">T</div><div><div style="font-weight:700;font-size:.9rem">开普勒第三定律 T²∝a³</div><div style="font-size:.78rem;color:#6B6B6B">轨道半径越大公转周期越长。T²/a³对所有行星近似常数。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(46,204,113,0.1);color:#2ecc71;font-weight:700">⊕</div><div><div style="font-weight:700;font-size:.9rem">类地行星 vs 类木行星</div><div style="font-size:.78rem;color:#6B6B6B">内四颗岩石行星小而密，外四颗气态巨行星大而疏。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(230,126,34,0.1);color:#e67e22;font-weight:700">G</div><div><div style="font-weight:700;font-size:.9rem">万有引力提供向心力</div><div style="font-size:.78rem;color:#6B6B6B">GMm/r²=mv²/r，太阳质量占太阳系总质量的99.86%。</div></div></div></div></div></section></div>
<script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');const sSpeed=document.getElementById('slider-speed');const bSpeed=document.getElementById('badge-speed');const resPlanet=document.getElementById('res-planet'),resPeriod=document.getElementById('res-period');const fRoot=document.getElementById('formula-root');
const planets=[{name:'水星',en:'Mercury',color:'#b0b0b0',r:28,period:0.24,size:2.5},{name:'金星',en:'Venus',color:'#f5c842',r:40,period:0.62,size:4},{name:'地球',en:'Earth',color:'#3498db',r:55,period:1.0,size:4.5},{name:'火星',en:'Mars',color:'#e74c3c',r:70,period:1.88,size:3},{name:'木星',en:'Jupiter',color:'#e8c090',r:100,period:11.86,size:12},{name:'土星',en:'Saturn',color:'#f0d890',r:125,period:29.46,size:10},{name:'天王星',en:'Uranus',color:'#7ec8e3',r:155,period:84.01,size:6},{name:'海王星',en:'Neptune',color:'#4169e1',r:175,period:164.8,size:6}];
const S={playing:false,speed:1,time:0};
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}window.addEventListener('resize',resize);
function update(){S.speed=parseFloat(sSpeed.value);bSpeed.textContent=S.speed+'x';const dt=0.016;if(S.playing)S.time+=dt*S.speed;fRoot.innerHTML='☀ Sun&nbsp;|&nbsp;'+planets.map(p=>'<span style="color:'+p.color+'">●</span> '+p.name+'/'+p.en).join('&nbsp;|&nbsp;');draw();requestAnimationFrame(update)}
function draw(){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,w,h);for(let i=0;i<30;i++){ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.5)+')';ctx.fillRect(Math.random()*w,Math.random()*h,1.2,1.2)}const cx=w*0.48,cy=h*0.52;
ctx.fillStyle='#ffdd57';const sunR=18;ctx.beginPath();ctx.arc(cx,cy,sunR,0,Math.PI*2);ctx.fill();const sunGlow=ctx.createRadialGradient(cx,cy,sunR*0.5,cx,cy,sunR*3);sunGlow.addColorStop(0,'rgba(255,255,150,0.5)');sunGlow.addColorStop(1,'rgba(255,150,50,0)');ctx.fillStyle=sunGlow;ctx.beginPath();ctx.arc(cx,cy,sunR*3,0,Math.PI*2);ctx.fill();
planets.forEach(p=>{const ang=(S.time*2*Math.PI)/p.period;const px=cx+p.r*Math.cos(ang),py=cy+p.r*Math.sin(ang);ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;ctx.beginPath();ctx.arc(cx,cy,p.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(px,py,p.size,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 8px Fredoka';ctx.textAlign='center';ctx.fillText(p.name,px,py-p.size-5)});
ctx.fillStyle='#fff';ctx.font='bold 10px Fredoka';ctx.fillText('Sun',cx,cy+sunR+12);ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px Fredoka';ctx.textAlign='right';ctx.fillText('t='+S.time.toFixed(1)+'年',w-10,20)}
document.getElementById('btn-start').onclick=()=>{S.playing=!S.playing;const b=document.getElementById('btn-start');b.textContent=S.playing?'暂停 Pause':'开始 Start';b.classList.toggle('start',!S.playing);b.classList.toggle('pause',S.playing)};
document.getElementById('btn-reset').onclick=()=>{S.time=0;S.playing=false;document.getElementById('btn-start').textContent='开始 Start';document.getElementById('btn-start').className='ctrl-btn start'};
resize();requestAnimationFrame(update);

document.addEventListener('keydown',(e)=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  const startBtn=document.getElementById('btn-start');
  const resetBtn=document.getElementById('btn-reset');
  if(e.code==='Space'){e.preventDefault();startBtn&&startBtn.click();}
  else if(e.code==='KeyR'){e.preventDefault();resetBtn&&resetBtn.click();}
});
