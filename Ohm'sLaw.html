<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欧姆定律 / Ohm's Law - Wuli布雷克</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF9F0; --primary: #FF8c42; --secondary: #FFC75F;
            --accent: #FF5E5B; --text-dark: #4A403A; --card-bg: #FFFFFF;
            --shadow: 0 6px 30px rgba(255,140,66,0.18);
            --col-v: #d32f2f; --col-i: #2e7d32; --col-r: #1565c0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka','Noto Sans SC',sans-serif; background: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 5px 40px 10px; }
        .branding { position: fixed; top: 10px; left: 20px; z-index: 1000; }
        .logo { font-weight: 700; font-size: 1.3rem; color: #fff; background: var(--primary); padding: 6px 18px; border-radius: 16px; box-shadow: 4px 4px 15px rgba(255,140,66,0.3); }
        .container { width: 100%; max-width: 1400px; margin-top: 8px; display: grid; grid-template-areas:"header header" "formula formula" "diagram controls"; grid-template-columns: 1fr 400px; gap: 12px; }
        header { grid-area: header; text-align: center; }
        h1 { font-size: 2rem; color: var(--text-dark); margin-bottom: 2px; }
        .formula-display { grid-area: formula; background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 10px 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #fff5eb; }
        .formula-container { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; font-size: 2.8rem; font-weight: 700; }
        .frac { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; }
        .frac-line { width: 1.2em; height: 4px; background: var(--text-dark); margin: 2px 0; border-radius: 2px; }
        .sym { display: inline-block; transition: transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275); }
        .result-row { font-size: 1rem; font-weight: 600; margin-top: 6px; display: flex; gap: 20px; justify-content: center; }
        .legend { display: flex; gap: 16px; justify-content: center; border-top: 1px solid #eee; padding-top: 6px; width: 100%; flex-wrap: wrap; }
        .legend-item { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .diagram-section { grid-area: diagram; background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; min-height: 320px; display: flex; flex-direction: column; border: 2px solid #fff5eb; }
        #cvs { width: 100%; flex: 1; display: block; }
        .controls-section { grid-area: controls; display: flex; flex-direction: column; gap: 10px; }
        .control-panel { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 3px; }
        .label-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .val-badge { background: #fff; padding: 1px 7px; border-radius: 7px; font-size: 0.85rem; border: 2px solid #f0f0f0; }
        input[type=range] { width: 100%; appearance: none; height: 6px; background: #eee; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; background: var(--primary); }
        #sld-v::-webkit-slider-thumb { background: var(--col-v); }
        #sld-r::-webkit-slider-thumb { background: var(--col-r); }
        .info-card { background: #fff; border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 0.9rem; line-height: 1.4; color: #5D6D7E; }
        .circuit-mini { width: 100%; max-width: 230px; margin-top: 4px; }
        @media(max-width:1100px){.container{grid-template-areas:"header" "formula" "diagram" "controls";grid-template-columns:1fr}}
    </style>
</head>

<body>
    <div class="branding"><div class="logo">Wuli布雷克</div></div>
    <div class="container">
        <header><h1>欧姆定律 / Ohm's Law</h1></header>

        <section class="formula-display" style="flex-direction:row;align-items:center;justify-content:center;gap:20px;">
            <div class="formula-container" style="flex-shrink:0;min-height:auto;">
                <span id="f-i" class="sym" style="color: var(--col-i);">I</span>
                <span style="margin: 0 12px; color: #ccc; font-size: 1.6rem;">=</span>
                <div class="frac">
                    <span id="f-v" class="sym" style="color: var(--col-v);">V</span>
                    <div class="frac-line"></div>
                    <span id="f-r" class="sym" style="color: var(--col-r);">R</span>
                </div>
            </div>
            <div class="result-row">
                <span>电流 I = <strong id="txt-i" style="color:var(--col-i)">--</strong> A</span>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:var(--col-v)"></span> 电压 V (V)</div>
                <div class="legend-item"><span class="legend-dot" style="background:var(--col-r)"></span> 电阻 R (Ω)</div>
                <div class="legend-item"><span class="legend-dot" style="background:var(--col-i)"></span> 电流 I (A)</div>
            </div>
            <svg width="250" height="85" viewBox="0 0 400 130" preserveAspectRatio="xMidYMid meet" style="flex-shrink:0;">
                <path d="M 60 110 L 60 45 L 340 45 L 340 110 L 60 110" fill="none" stroke="#444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="165" y="30" width="70" height="30" fill="white" stroke="var(--col-r)" stroke-width="3" rx="4"/>
                <text x="200" y="50" font-family="Fredoka" font-size="14" fill="var(--col-r)" font-weight="bold" text-anchor="middle">R</text>
                <circle cx="340" cy="80" r="18" fill="white" stroke="var(--col-i)" stroke-width="3"/>
                <text x="340" y="86" font-family="Fredoka" font-size="15" fill="var(--col-i)" font-weight="bold" text-anchor="middle">A</text>
                <path d="M 165 45 L 165 75 L 235 75 L 235 45" fill="none" stroke="var(--col-v)" stroke-width="2"/>
                <circle cx="200" cy="75" r="18" fill="white" stroke="var(--col-v)" stroke-width="3"/>
                <text x="200" y="81" font-family="Fredoka" font-size="15" fill="var(--col-v)" font-weight="bold" text-anchor="middle">V</text>
            </svg>
        </section>

        <section class="diagram-section"><canvas id="cvs"></canvas></section>

        <section class="controls-section">
            <div class="control-panel">
                <div class="control-group">
                    <div class="label-row"><span style="color:var(--col-v)">电压 Voltage (V)</span><span id="txt-v" class="val-badge">-- V</span></div>
                    <input type="range" id="sld-v" min="1" max="30" step="0.5" value="15">
                </div>
                <div class="control-group">
                    <div class="label-row"><span style="color:var(--col-r)">电阻 Resistance (R)</span><span id="txt-r" class="val-badge">-- Ω</span></div>
                    <input type="range" id="sld-r" min="1" max="50" step="1" value="10">
                </div>
            </div>
            <div class="info-card">
                <div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:1.1rem">演示要点 / Key Points</div>
                <div style="display:flex;flex-direction:column;gap:6px">
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,140,66,0.1);color:var(--primary);font-weight:700">I</div>
                        <div><div style="font-weight:700;font-size:0.9rem">I = V / R</div><div style="font-size:0.78rem;color:#888">欧姆定律：电流与电压成正比，与电阻成反比。</div></div>
                    </div>
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(211,47,47,0.1);color:var(--col-v);font-weight:700">V</div>
                        <div><div style="font-weight:700;font-size:0.9rem">I-V 图斜率 = 1/R</div><div style="font-size:0.78rem;color:#888">图像中直线斜率越大，电阻越小；斜率越小，电阻越大。</div></div>
                    </div>
                    <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(21,101,192,0.1);color:var(--col-r);font-weight:700">R</div>
                        <div><div style="font-weight:700;font-size:0.9rem">固定电阻下V-I为直线</div><div style="font-size:0.78rem;color:#888">欧姆导体满足线性关系，图像中直线经过原点。</div></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const sldV = document.getElementById('sld-v');
        const sldR = document.getElementById('sld-r');
        const txtV = document.getElementById('txt-v');
        const txtR = document.getElementById('txt-r');
        const txtI = document.getElementById('txt-i');
        const fi = document.getElementById('f-i');
        const fv = document.getElementById('f-v');
        const fr = document.getElementById('f-r');
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');

        // Config
        const MAX_V = 30;
        const MAX_I_GRAPH = 3; // Y-axis max for graph

        function drawGraph(V, R, I) {
            // Resize canvas to parent
            const rect = canvas.parentElement.getBoundingClientRect();
            // Subtract padding
            const w = canvas.width = rect.width - 22;
            const h = canvas.height = rect.height - 40;

            const padLeft = 40;
            const padBottom = 30;
            const padTop = 20;
            const padRight = 20;

            const graphW = w - padLeft - padRight;
            const graphH = h - padTop - padBottom;

            ctx.clearRect(0, 0, w, h);

            // Axes
            ctx.beginPath();
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            // Y axis
            ctx.moveTo(padLeft, padTop);
            ctx.lineTo(padLeft, h - padBottom);
            // X axis
            ctx.lineTo(w - padRight, h - padBottom);
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#666';
            ctx.font = 'bold 12px Fredoka';
            ctx.textAlign = 'right';
            ctx.fillText("I (A)", padLeft - 10, padTop + 10);
            ctx.textAlign = 'right';
            ctx.fillText("V (V)", w - padRight, h - padBottom - 10);

            // Grid lines (Simple)
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 1;
            ctx.beginPath();
            /*
            let y = padTop;
            ctx.moveTo(padLeft, y); ctx.lineTo(w-padRight, y);
            */
            ctx.stroke();

            // Plot Characteristic Line (Slope = 1/R)
            // Points: (0,0) -> (MAX_V, MAX_V/R)
            const x1 = 0;
            const y1 = 0;
            const x2 = MAX_V;
            const y2 = MAX_V / R;

            const mapX = (x) => padLeft + (x / MAX_V) * graphW;
            const mapY = (y) => (h - padBottom) - (y / MAX_I_GRAPH) * graphH;

            // Draw Full Line
            ctx.beginPath();
            ctx.strokeStyle = '#bbdefb'; // Light Blue
            ctx.lineWidth = 2;
            ctx.moveTo(mapX(x1), mapY(y1));
            // Clamp to visible graph area area?
            // Ideally we draw to V=MAX_V, but I might exceed axes if R is small.
            // Let's just draw to V_max for this R at current scale, or edge of graph

            // Actually, let's just draw the line segment relevant to current V?
            // No, the line represents the Resistance.
            // Let's find end point. End X is MAX_V.
            let endX = MAX_V;
            let endY = MAX_V / R;

            if (endY > MAX_I_GRAPH) {
                // Clip by Y
                endY = MAX_I_GRAPH;
                endX = endY * R;
            }

            ctx.lineTo(mapX(endX), mapY(endY));
            ctx.stroke();

            // Draw Current Point
            const ptX = mapX(V);
            const ptY = mapY(I);

            // Dashed Guides
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = '#aaa';
            ctx.beginPath();
            ctx.moveTo(ptX, h - padBottom);
            ctx.lineTo(ptX, ptY);
            ctx.lineTo(padLeft, ptY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Highlight Active Segment
            ctx.beginPath();
            ctx.strokeStyle = 'var(--col-r)'; // Blue
            ctx.lineWidth = 3;
            ctx.moveTo(mapX(0), mapY(0));
            ctx.lineTo(ptX, ptY);
            ctx.stroke();

            // Point
            ctx.fillStyle = 'var(--col-v)'; // Red dot
            ctx.beginPath();
            ctx.arc(ptX, ptY, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function update() {
            const V = parseFloat(sldV.value);
            const R = parseFloat(sldR.value);
            const I = V / R;

            txtV.innerText = V.toFixed(1) + " V";
            txtR.innerText = R.toFixed(0) + " Ω";
            txtI.innerText = I.toFixed(2) + " A";

            // Formula Animation
            fv.style.transform = `scale(${0.9 + V / 60})`;
            fr.style.transform = `scale(${0.9 + R / 100})`;
            const iScale = Math.min(Math.max(0.8 + I / 3, 0.8), 1.3);
            fi.style.transform = `scale(${iScale})`;

            requestAnimationFrame(() => drawGraph(V, R, I));
        }

        sldV.addEventListener('input', update);
        sldR.addEventListener('input', update);
        window.addEventListener('resize', update);

        // Init
        update();
    </script>
</body>

</html>
