<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【标题 / Title】 - Wuli布雷克</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF9F0;
            --primary: #FF8c42;
            --secondary: #FFC75F;
            --accent: #FF5E5B;
            --text-dark: #4A403A;
            --card-bg: #FFFFFF;
            --shadow: 0 6px 30px rgba(255, 140, 66, 0.18);
            /* 自定义颜色变量（可选）*/
            --sim-color-1: #9b59b6;
            --sim-color-2: #2ecc71;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 5px 40px 10px;
        }

        .branding { position: fixed; top: 10px; left: 20px; z-index: 1000; }
        .logo {
            font-weight: 700; font-size: 1.3rem; color: #fff;
            background: var(--primary); padding: 6px 18px; border-radius: 16px;
            box-shadow: 4px 4px 15px rgba(255,140,66,0.3);
        }

        .container {
            width: 100%; max-width: 1400px; margin-top: 8px;
            display: grid;
            grid-template-areas:
                "header header"
                "formula formula"
                "diagram controls";
            grid-template-columns: 1fr 420px; gap: 12px;
        }

        header { grid-area: header; text-align: center; }
        h1 { font-size: 2rem; color: var(--text-dark); margin-bottom: 2px; }

        .formula-display {
            grid-area: formula; background: var(--card-bg);
            border-radius: 20px; box-shadow: var(--shadow); padding: 10px 20px;
            display: flex; flex-direction: column; align-items: center; border: 2px solid #fff5eb;
        }
        .formula-container {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; flex-wrap: wrap; min-height: 44px;
        }
        .result-row {
            font-size: 0.95rem; font-weight: 600; color: var(--text-dark);
            margin-top: 4px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        }
        .legend {
            display: flex; gap: 16px; justify-content: center;
            border-top: 1px solid #eee; padding-top: 6px; width: 100%; flex-wrap: wrap;
        }
        .legend-item { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

        .diagram-section {
            grid-area: diagram; background: var(--card-bg); border-radius: 20px;
            box-shadow: var(--shadow); position: relative; overflow: hidden;
            min-height: 380px; display: flex; flex-direction: column; border: 2px solid #fff;
        }
        canvas { width: 100%; flex: 1; display: block; }

        .controls-section { grid-area: controls; display: flex; flex-direction: column; gap: 10px; }
        .control-panel {
            background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow);
            padding: 14px 18px; display: flex; flex-direction: column; gap: 10px;
        }

        .param-section {
            background: #fff; border-radius: 14px; padding: 10px 14px 8px; border: 2px solid #f5f0eb;
        }
        .param-section-header {
            font-weight: 700; font-size: 0.95rem; margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }

        .control-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 1px; }
        .label-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .val-badge {
            background: #fff; padding: 1px 7px; border-radius: 7px;
            font-size: 0.85rem; border: 2px solid #f0f0f0;
        }

        input[type=range] {
            width: 100%; appearance: none; height: 6px;
            background: #eee; border-radius: 3px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none; width: 20px; height: 20px; border-radius: 50%;
            cursor: pointer; background: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
        .ctrl-btn {
            padding: 10px; border: none; border-radius: 14px;
            font-size: 1.05rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s; color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .start { background-color: var(--primary); }
        .pause { background-color: #2ecc71; }
        .reset { background-color: #95a5a6; }
        .ctrl-btn:active { transform: translateY(2px); box-shadow: none; }

        .info-card {
            background: var(--card-bg); border-radius: 20px;
            padding: 12px 16px; box-shadow: var(--shadow);
            font-size: 0.9rem; line-height: 1.4; color: #5D6D7E;
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-areas: "header" "formula" "diagram" "controls";
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="branding"><div class="logo">Wuli布雷克</div></div>

    <div class="container">
        <header>
            <h1>【标题中文 / Title English】</h1>
            <!-- 可加副标题 <p style="color:#888;font-size:0.9rem;">副标题 / Subtitle</p> -->
        </header>

        <section class="formula-display">
            <div class="formula-container" id="formula-root">
                <!-- 【插入公式】动态或静态公式 -->
            </div>
            <div class="result-row" id="result-area">
                <!-- 【插入结果行】如 <span>结果: <strong id="res">0</strong></span> -->
            </div>
            <div class="legend">
                <!-- 【插入图例】每项: <div class="legend-item"><span class="legend-dot" style="background:#xxx"></span> 说明</div> -->
            </div>
        </section>

        <section class="diagram-section">
            <canvas id="simCanvas"></canvas>
        </section>

        <section class="controls-section">
            <div class="control-panel">
                <!-- 【插入参数滑块】每个: -->
                <!-- <div class="control-group">
                    <div class="label-row"><span>参数名</span><span id="badge" class="val-badge">默认值</span></div>
                    <input type="range" id="slider" min="0" max="100" step="1" value="50">
                </div> -->

                <!-- 【可选：多组参数用 param-section 包裹】 -->
                <!-- <div class="param-section" style="border-left: 5px solid var(--sim-color-1);">
                    <div class="param-section-header">分组标题</div>
                    ... 控件 ...
                </div> -->

                <!-- 【可选：下拉选择】 -->
                <!-- <select id="mode-select" style="width:100%; padding:8px 14px; border-radius:12px; border:2px solid #e8ddd0;"> -->

                <div class="btn-row">
                    <button id="btn-start" class="ctrl-btn start">开始 Start</button>
                    <button id="btn-reset" class="ctrl-btn reset">重置 Reset</button>
                </div>
            </div>

            <div class="info-card">
                <div style="font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 1.1rem;">
                    演示要点 / Key points
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <!-- 【插入要点】每项: -->
                    <!-- <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;">
                        <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;">🔑</div>
                        <div><div style="font-weight:700;font-size:0.9rem;">标题</div><div style="font-size:0.78rem;color:#888;">说明</div></div>
                    </div> -->
                </div>
            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas'), ctx = canvas.getContext('2d');
        // 【插入 DOM 引用 + 状态 + 动画循环 + 绘制逻辑】

        function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
        window.addEventListener('resize', resize);

        // 【插入 update() / draw() 等函数】

        // 按钮模板（保留或按需修改）：
        const bStart = document.getElementById('btn-start'), bReset = document.getElementById('btn-reset');
        bStart.onclick = () => {
            /* 切换播放/暂停 */
        };
        bReset.onclick = () => {
            /* 重置状态 */
        };

        resize();
        /* 启动循环: update(); 或 requestAnimationFrame(update); */
    </script>
</body>
</html>
