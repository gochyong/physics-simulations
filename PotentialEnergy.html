<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wuli布雷克物理模拟实验室 - 重力势能 / Gravitational Potential Energy。50个免费交互式物理模拟，覆盖力学、热学、电磁学、波、近代物理、天文六大板块。">

    <meta property="og:description" content="Wuli布雷克物理模拟实验室 - 重力势能 / Gravitational Potential Energy。50个免费交互式物理模拟，覆盖力学、热学、电磁学、波、近代物理、天文六大板块。">

    <title>重力势能 / Gravitational Potential Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF9F0; --primary: #FF8c42; --secondary: #FFC75F;
            --accent: #FF5E5B; --text-dark: #4A403A; --card-bg: #FFFFFF;
            --shadow: 0 6px 30px rgba(255,140,66,0.18);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka','Noto Sans SC',sans-serif; background: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 5px 40px 10px; }
        .branding { position: fixed; top: 10px; left: 20px; z-index: 1000; }
        .logo { font-weight: 700; font-size: 1.3rem; color: #fff; background: var(--primary); padding: 6px 18px; border-radius: 16px; box-shadow: 4px 4px 15px rgba(255,140,66,0.3); }
        .container { width: 100%; max-width: 1400px; margin-top: 8px; display: grid; grid-template-areas:"header header" "formula formula" "diagram controls"; grid-template-columns: 1fr 400px; gap: 12px; }
        header { grid-area: header; text-align: center; }
        h1 { font-size: 2rem; color: var(--text-dark); margin-bottom: 2px; }
        .formula-display { grid-area: formula; background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 10px 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #fff5eb; }
        .formula-container { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; min-height: 50px; }
        .result-row { font-size: 1rem; font-weight: 600; margin-top: 6px; display: flex; gap: 20px; justify-content: center; }
        .legend { display: flex; gap: 16px; justify-content: center; border-top: 1px solid #eee; padding-top: 6px; width: 100%; flex-wrap: wrap; }
        .legend-item { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .diagram-section { grid-area: diagram; background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; min-height: 320px; display: flex; flex-direction: column; border: 2px solid #fff5eb; }
        #simCanvas { width: 100%; flex: 1; display: block; }
        .controls-section { grid-area: controls; display: flex; flex-direction: column; gap: 10px; }
        .control-panel { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 3px; }
        .label-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .val-badge { background: #fff; padding: 1px 7px; border-radius: 7px; font-size: 0.85rem; border: 2px solid #f0f0f0; }
        input[type=range] { width: 100%; appearance: none; height: 6px; background: #eee; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; }
        #m-slider::-webkit-slider-thumb { background: #9b59b6; }
        #g-slider::-webkit-slider-thumb { background: #e67e22; }
        #h-slider::-webkit-slider-thumb { background: #2ecc71; }
        /* Page-specific: select */
        select { width: 100%; padding: 6px 10px; border-radius: 8px; border: 2px solid #eee; font-family: inherit; font-size: 0.85rem; color: var(--text-dark); outline: none; cursor: pointer; background: #fff; }
        select:focus { border-color: var(--primary); }
        /* Page-specific: gauge */
        .gauge-panel { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        sup { font-size: 0.6em; vertical-align: top; position: relative; top: -0.2em; }
        @media(max-width:1100px){.container{grid-template-areas:"header" "formula" "diagram" "controls";grid-template-columns:1fr}}
    </style>
</head>

<body>
    <div class="branding"><div class="logo">Wuli布雷克</div></div>
    <div class="container">
        <header><h1>重力势能 / Gravitational Potential Energy</h1></header>

        <section class="formula-display">
            <div class="formula-container" id="formula-root"></div>
            <div class="result-row">
                E<sub>p</sub> = <span id="res-m" style="color:#9b59b6">0</span> kg &times; <span id="res-g" style="color:#e67e22">9.8</span> m/s&sup2; &times; <span id="res-h" style="color:#2ecc71">0</span> m
                = <strong id="res-Ep" style="color:var(--accent)">0.00</strong> J
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span> E<sub>p</sub> 重力势能</div>
                <div class="legend-item"><span class="legend-dot" style="background:#9b59b6"></span> m 质量</div>
                <div class="legend-item"><span class="legend-dot" style="background:#e67e22"></span> g 重力场强度</div>
                <div class="legend-item"><span class="legend-dot" style="background:#2ecc71"></span> h 高度</div>
            </div>
        </section>

        <section class="diagram-section"><canvas id="simCanvas"></canvas></section>

        <section class="controls-section">
            <div class="control-panel">
                <div class="control-group">
                    <div class="label-row"><span style="color:#9b59b6">质量 m / Mass</span><span id="m-badge" class="val-badge">10 kg</span></div>
                    <input type="range" id="m-slider" min="1" max="100" value="10">
                </div>
                <div class="control-group">
                    <div class="label-row"><span style="color:#2ecc71">高度 h / Height</span><span id="h-badge" class="val-badge">5 m</span></div>
                    <input type="range" id="h-slider" min="0" max="10" step="0.1" value="5">
                </div>
                <div class="control-group">
                    <div class="label-row"><span style="color:#e67e22">重力场强度 g</span><span id="g-badge" class="val-badge">9.8 N/kg</span></div>
                    <select id="g-select">
                        <option value="0.00">太空 Space (0.00 N/kg)</option>
                        <option value="1.62">月球 Moon (1.62 N/kg)</option>
                        <option value="3.72">火星 Mars (3.72 N/kg)</option>
                        <option value="9.81" selected>地球 Earth (9.81 N/kg)</option>
                        <option value="24.8">木星 Jupiter (24.8 N/kg)</option>
                        <option value="274">太阳 Sun (274 N/kg)</option>
                    </select>
                </div>
                <div style="margin-top:4px;text-align:center;color:#999;font-size:0.78rem;">物体大小随质量变化，高度滑块实时变动。</div>
            </div>
            <div class="gauge-panel">
                <canvas id="gaugeCanvas" width="300" height="220"></canvas>
                <div style="font-weight:700;font-size:0.9rem;color:#555;margin-top:-6px;">能量 E<sub>p</sub> / Energy</div>
            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas'), ctx = canvas.getContext('2d');
        const gCanvas = document.getElementById('gaugeCanvas'), gCtx = gCanvas.getContext('2d');

        const sM = document.getElementById('m-slider'), sH = document.getElementById('h-slider'), sG = document.getElementById('g-select');
        const bM = document.getElementById('m-badge'), bH = document.getElementById('h-badge'), bG = document.getElementById('g-badge');
        const resEp = document.getElementById('res-Ep'), resM = document.getElementById('res-m'), resG = document.getElementById('res-g'), resH = document.getElementById('res-h');
        const formulaRoot = document.getElementById('formula-root');

        const state = {
            m: 10, h: 5, g: 9.8
        };

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        function update() {
            state.m = parseFloat(sM.value);
            state.h = parseFloat(sH.value);
            state.g = parseFloat(sG.value);

            bM.textContent = state.m + ' kg';
            bH.textContent = state.h + ' m';
            bG.textContent = state.g + ' N/kg';

            updateFormula();
            draw();
            drawGauge();
            requestAnimationFrame(update);
        }

        function updateFormula() {
            const Ep = state.m * state.g * state.h;
            resEp.textContent = Ep.toFixed(2);
            resM.textContent = state.m;
            if (state.g === 0) resG.textContent = "0.00";
            else if (state.g < 10) resG.textContent = state.g.toFixed(2);
            else if (state.g < 100) resG.textContent = state.g.toFixed(1);
            else resG.textContent = state.g.toFixed(0);
            resH.textContent = state.h.toFixed(1);

            const baseSize = 48;
            const maxEpForScale = 100 * 30 * 10;
            const scaleEp = 1 + (Math.min(maxEpForScale, Ep) / maxEpForScale) * 0.3;
            const scaleM = 1 + (state.m / 100) * 0.2;
            const scaleG = 1 + (state.g / 30) * 0.2;
            const scaleH = 1 + (state.h / 10) * 0.2;

            const html = `
                <span style="color:var(--accent);font-weight:700;font-size:${baseSize * scaleEp}px;transition:all 0.2s;">E<sub>p</sub></span>
                <span style="width:10px"></span>
                <span style="color:var(--text-dark);font-size:${baseSize}px">=</span>
                <span style="width:10px"></span>
                <span style="color:#9b59b6;font-weight:700;font-size:${baseSize * scaleM}px;transition:all 0.2s;">m</span>
                <span style="width:8px;color:var(--text-dark);font-size:${baseSize}px">&middot;</span>
                <span style="color:#e67e22;font-weight:700;font-size:${baseSize * scaleG}px;transition:all 0.2s;">g</span>
                <span style="width:8px;color:var(--text-dark);font-size:${baseSize}px">&middot;</span>
                <span style="color:#2ecc71;font-weight:700;font-size:${baseSize * scaleH}px;transition:all 0.2s;">h</span>
            `;
            if (formulaRoot.innerHTML !== html) formulaRoot.innerHTML = html;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const scale = 1.33;
            const groundY = canvas.height * 0.85;
            const centerX = canvas.width / 2;

            const radius = (15 + (Math.log10(state.m) * 12)) * scale;

            const meterPx = (canvas.height * 0.7) / 10;
            const currentY = groundY - (state.h * meterPx) - radius;

            ctx.beginPath(); ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 4;
            ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, groundY); ctx.lineTo(i - 10, groundY + 15); ctx.stroke();
            }

            ctx.beginPath(); ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.moveTo(centerX - 80, groundY); ctx.lineTo(centerX - 80, groundY - (10 * meterPx));
            ctx.stroke(); ctx.setLineDash([]);

            for (let i = 0; i <= 10; i++) {
                const y = groundY - (i * meterPx);
                ctx.beginPath(); ctx.strokeStyle = '#bbb'; ctx.moveTo(centerX - 85, y); ctx.lineTo(centerX - 75, y); ctx.stroke();
                ctx.fillStyle = '#bbb'; ctx.font = '12px Arial'; ctx.textAlign = 'right';
                ctx.fillText(i + 'm', centerX - 90, y + 4);
            }

            const shadowScale = 1 - (state.h / 15);
            ctx.beginPath(); ctx.ellipse(centerX, groundY + radius * 0.2, radius * shadowScale, radius * 0.2 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0,0,0,${0.1 * shadowScale})`; ctx.fill();

            if (state.h > 0) {
                ctx.beginPath(); ctx.strokeStyle = '#2ecc71'; ctx.setLineDash([3, 3]);
                ctx.moveTo(centerX, groundY); ctx.lineTo(centerX, currentY + radius);
                ctx.stroke(); ctx.setLineDash([]);

                ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 20px Fredoka'; ctx.textAlign = 'left';
                ctx.fillText('h = ' + state.h.toFixed(1) + 'm', centerX + radius + 10, groundY - (state.h * meterPx / 2));
            }

            ctx.beginPath(); ctx.arc(centerX, currentY, radius, 0, Math.PI * 2);
            const g = ctx.createRadialGradient(centerX - radius * 0.3, currentY - radius * 0.3, radius * 0.1, centerX, currentY, radius);
            g.addColorStop(0, '#fff'); g.addColorStop(0.2, '#9b59b6'); g.addColorStop(1, '#000');
            ctx.fillStyle = g; ctx.fill();
            ctx.beginPath(); ctx.arc(centerX, currentY, radius, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1.5; ctx.stroke();

            if (state.g > 0) {
                const vectorLen = state.g * 2 * scale;
                drawArrow(centerX, currentY, centerX, currentY + radius + vectorLen, '#e67e22', 4, 'g');
            }
        }

        function drawArrow(x1, y1, x2, y2, color, width, label) {
            const headlen = 12;
            const dx = x2 - x1, dy = y2 - y1;
            const angle = Math.atan2(dy, dx);
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath(); ctx.fillStyle = color; ctx.fill();
            if (label) {
                ctx.fillStyle = color; ctx.font = 'bold 24px Fredoka'; ctx.textAlign = 'center';
                ctx.fillText(label, x2 + 15 * Math.cos(angle), y2 + 15 * Math.sin(angle));
            }
        }

        function drawGauge() {
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            const cx = gCanvas.width / 2, cy = gCanvas.height * 0.75;
            const r = 100;
            const startAngle = Math.PI * 0.8, endAngle = Math.PI * 2.2, range = endAngle - startAngle;

            gCtx.beginPath(); gCtx.arc(cx, cy, r, startAngle, endAngle); gCtx.lineWidth = 12; gCtx.strokeStyle = '#f0f0f0'; gCtx.lineCap = 'round'; gCtx.stroke();

            const Ep = state.m * state.g * state.h;
            const maxEpForGauge = 100 * 9.8 * 10;
            const normVal = Math.min(1, Ep / maxEpForGauge);
            const currentAngle = startAngle + range * normVal;

            gCtx.beginPath(); gCtx.arc(cx, cy, r, startAngle, currentAngle);
            const gradient = gCtx.createLinearGradient(cx - r, cy, cx + r, cy);
            gradient.addColorStop(0, '#FFC75F'); gradient.addColorStop(1, Ep > maxEpForGauge ? '#e74c3c' : '#FF5E5B');
            gCtx.strokeStyle = gradient; gCtx.lineWidth = 12; gCtx.stroke();

            gCtx.beginPath(); gCtx.lineWidth = 4; gCtx.strokeStyle = '#333';
            gCtx.moveTo(cx, cy); gCtx.lineTo(cx + (r - 15) * Math.cos(currentAngle), cy + (r - 15) * Math.sin(currentAngle));
            gCtx.stroke();
            gCtx.beginPath(); gCtx.arc(cx, cy, 7, 0, Math.PI * 2); gCtx.fillStyle = '#333'; gCtx.fill();

            gCtx.font = 'bold 24px Fredoka'; gCtx.fillStyle = '#444'; gCtx.textAlign = 'center';
            gCtx.fillText(Math.round(Ep) + ' J', cx, cy + 40);

            gCtx.font = '14px Arial'; gCtx.fillStyle = '#bbb';
            gCtx.fillText("0", cx - r - 20, cy); gCtx.fillText("MAX", cx + r + 20, cy);
        }

        resize();
        update();
    </script>
<div style="text-align:center;padding:20px;font-size:0.8rem;color:#a1887f;margin-top:auto;">© 2025 Wuli布雷克 | MIT License </div>
