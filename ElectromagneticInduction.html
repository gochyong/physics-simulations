<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁感应 / Electromagnetic Induction - Wuli布雷克</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #FFF9F0; --primary: #FF8c42; --secondary: #FFC75F; --accent: #FF5E5B; --text-dark: #4A403A; --card-bg: #FFFFFF; --shadow: 0 6px 30px rgba(255,140,66,0.18); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka','Noto Sans SC',sans-serif; background: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 5px 40px 10px; }
        .branding { position: fixed; top: 10px; left: 20px; z-index: 1000; }
        .logo { font-weight: 700; font-size: 1.3rem; color: #fff; background: var(--primary); padding: 6px 18px; border-radius: 16px; box-shadow: 4px 4px 15px rgba(255,140,66,0.3); }
        .container { width: 100%; max-width: 1400px; margin-top: 8px; display: grid; grid-template-areas:"header header" "formula formula" "diagram controls"; grid-template-columns: 1fr 400px; gap: 12px; }
        header { grid-area: header; text-align: center; } h1 { font-size: 2rem; margin-bottom: 2px; }
        .formula-display { grid-area: formula; background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 10px 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #fff5eb; }
        .formula-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 40px; }
        .result-row { font-size: 0.95rem; font-weight: 600; margin-top: 4px; display: flex; gap: 20px; justify-content: center; }
        .legend { display: flex; gap: 16px; justify-content: center; border-top: 1px solid #eee; padding-top: 6px; width: 100%; flex-wrap: wrap; }
        .legend-item { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .diagram-section { grid-area: diagram; display: flex; flex-direction: column; gap: 6px; }
        .main-wrap { background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; min-height: 260px; display: flex; border: 2px solid #fff; flex: 2; }
        #simCanvas { width: 100%; flex: 1; display: block; }
        .sub-wrap { background: #fff; border-radius: 16px; box-shadow: var(--shadow); flex: 1; display: flex; flex-direction: column; border: 1px solid #fff5eb; overflow: hidden; min-height: 130px; }
        .sub-label { background: #fff; padding: 3px 10px; font-weight: 700; font-size: 0.8rem; text-align: center; }
        .sub-wrap canvas { width: 100%; flex: 1; display: block; }
        .controls-section { grid-area: controls; display: flex; flex-direction: column; gap: 10px; }
        .control-panel { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
        .param-section { background: #fff; border-radius: 14px; padding: 10px 14px 8px; border: 2px solid #f5f0eb; }
        .param-section-header { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 3px; }
        .label-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .val-badge { background: #fff; padding: 1px 7px; border-radius: 7px; font-size: 0.85rem; border: 2px solid #f0f0f0; }
        input[type=range] { width: 100%; appearance: none; height: 6px; background: #eee; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; background: var(--primary); }
        .toggle-row { display: flex; gap: 8px; align-items: center; }
        .tog-btn { flex: 1; padding: 7px 10px; border: 2px solid #ddd; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; background: #fff; color: #888; transition: all .2s; }
        .tog-btn.sel { border-color: var(--primary); background: rgba(255,140,66,0.08); color: var(--primary); }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
        .ctrl-btn { padding: 10px; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; color: white; }
        .start { background: var(--primary); } .pause { background: #2ecc71; } .reset { background: #95a5a6; }
        .info-card { background: #fff; border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 0.9rem; line-height: 1.4; color: #5D6D7E; }
        @media (max-width:1100px) { .container { grid-template-areas:"header" "formula" "diagram" "controls"; grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="branding"><div class="logo">Wuli布雷克</div></div>
<div class="container">
<header><h1>电磁感应 / Electromagnetic Induction</h1></header>
<section class="formula-display">
    <div class="formula-container" id="formula-root"></div>
    <div class="result-row" id="result-row"></div>
    <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#e74c3c"></span> N极</div>
        <div class="legend-item"><span class="legend-dot" style="background:#3498db"></span> S极</div>
        <div class="legend-item"><span style="color:#D4956B">――</span> 线圈</div>
        <div class="legend-item"><span style="color:#27ae60">→</span> 速度 v</div>
    </div>
</section>
<section class="diagram-section">
    <div class="main-wrap"><canvas id="simCanvas"></canvas></div>
    <div class="sub-wrap">
        <div class="sub-label">感应电动势 EMF vs 磁铁位置 &nbsp; (法拉第定律 ε = −N dΦ/dt)</div>
        <canvas id="canvasEMF"></canvas>
    </div>
</section>
<section class="controls-section">
    <div class="control-panel">
        <div class="param-section" style="border-left:5px solid #e74c3c;">
            <div class="param-section-header">🧲 磁铁 / Magnet</div>
            <div class="control-group"><div class="label-row"><span>磁铁速度 Speed</span><span id="badge-speed" class="val-badge">2</span></div><input type="range" id="slider-speed" min="1" max="5" step="1" value="2"></div>
            <div class="toggle-row" style="margin-top:4px;">
                <span style="font-size:0.8rem;font-weight:600;">起始位置 Start:</span>
                <button class="tog-btn sel" id="btn-left" onclick="S.side='left';updateTog()">左侧 Left</button>
                <button class="tog-btn" id="btn-right" onclick="S.side='right';updateTog()">右侧 Right</button>
            </div>
            <div class="toggle-row" style="margin-top:2px;">
                <span style="font-size:0.8rem;font-weight:600;">NS 方向 NS Dir:</span>
                <button class="tog-btn sel" id="btn-nl" onclick="S.nsDir='N-left';updateTog()">N左S右</button>
                <button class="tog-btn" id="btn-nr" onclick="S.nsDir='N-right';updateTog()">N右S左</button>
            </div>
        </div>
        <div class="param-section" style="border-left:5px solid #8e44ad;">
            <div class="param-section-header">🔗 线圈 / Coil</div>
            <div class="control-group"><div class="label-row"><span>匝数 N</span><span id="badge-N" class="val-badge">5</span></div><input type="range" id="slider-N" min="1" max="10" step="1" value="5"></div>
            <div class="control-group" style="margin-top:4px;"><div class="label-row"><span>磁铁强度 B</span><span id="badge-B" class="val-badge">3</span></div><input type="range" id="slider-B" min="1" max="5" step="1" value="3"></div>
        </div>
        <div class="btn-row"><button id="btn-start" class="ctrl-btn start">开始 Start</button><button id="btn-reset" class="ctrl-btn reset">重置 Reset</button></div>
    </div>
    <div class="info-card">
        <div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:1.1rem;">物理要点 / Key Points</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px;"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,140,66,0.1);color:var(--primary);font-weight:700;">ε</div><div><div style="font-weight:700;font-size:0.9rem;">ε = −N dΦ/dt</div><div style="font-size:0.78rem;color:#888;">感应电动势等于磁通量变化率的负值乘以匝数。</div></div></div>
            <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px;"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(46,204,113,0.1);color:#2ecc71;font-weight:700;">🔄</div><div><div style="font-weight:700;font-size:0.9rem;">楞次定律</div><div style="font-size:0.78rem;color:#888;">感应电流方向总是阻碍磁通量的变化。</div></div></div>
            <div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px;"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(142,68,173,0.1);color:#8e44ad;font-weight:700;">Φ</div><div><div style="font-weight:700;font-size:0.9rem;">磁铁进出线圈→EMF反向</div><div style="font-size:0.78rem;color:#888;">进入和离开线圈时感应电动势方向相反。</div></div></div>
        </div>
    </div>
</section>
</div>

<script>
const simC = document.getElementById('simCanvas'), ctx = simC.getContext('2d');
const emfC = document.getElementById('canvasEMF'), ctxE = emfC.getContext('2d');
const sSpeed = document.getElementById('slider-speed'), sN = document.getElementById('slider-N'), sB = document.getElementById('slider-B');
const bSpeed = document.getElementById('badge-speed'), bN = document.getElementById('badge-N'), bB = document.getElementById('badge-B');
const bStart = document.getElementById('btn-start'), bReset = document.getElementById('btn-reset');
const fRoot = document.getElementById('formula-root'), rRow = document.getElementById('result-row');

const S = { speed: 2, N: 5, B: 3, side: 'left', nsDir: 'N-left', playing: false, magnetX: 0, time: 0 };
let lt = 0;
const EMF_POS = []; // {x, emf} — EMF vs magnet position

function updateTog() {
    document.getElementById('btn-left').className = 'tog-btn' + (S.side === 'left' ? ' sel' : '');
    document.getElementById('btn-right').className = 'tog-btn' + (S.side === 'right' ? ' sel' : '');
    document.getElementById('btn-nl').className = 'tog-btn' + (S.nsDir === 'N-left' ? ' sel' : '');
    document.getElementById('btn-nr').className = 'tog-btn' + (S.nsDir === 'N-right' ? ' sel' : '');
    EMF_POS.length = 0;
}

function resize() {
    simC.width = simC.clientWidth; simC.height = simC.clientHeight;
    emfC.width = emfC.clientWidth; emfC.height = emfC.clientHeight;
}
window.addEventListener('resize', resize);

function arrow(c, x, y, dx, dy, clr, lw) {
    const a = Math.atan2(dy, dx), h = 7, tx = x + dx, ty = y + dy;
    c.strokeStyle = clr; c.fillStyle = clr; c.lineWidth = lw || 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, y); c.lineTo(tx, ty); c.stroke();
    c.beginPath(); c.moveTo(tx, ty);
    c.lineTo(tx - h * Math.cos(a - Math.PI / 6), ty - h * Math.sin(a - Math.PI / 6));
    c.lineTo(tx - h * Math.cos(a + Math.PI / 6), ty - h * Math.sin(a + Math.PI / 6));
    c.closePath(); c.fill();
}

function draw() {
    ctx.clearRect(0, 0, simC.width, simC.height);
    const cw = simC.width, ch = simC.height;
    if (cw < 10 || ch < 10) return;
    ctx.fillStyle = '#fdfdfa'; ctx.fillRect(0, 0, cw, ch);

    const coilCx = cw * 0.50, coilCy = ch * 0.50;
    const coilW = 100, turnSp = Math.min(22, (ch * 0.6) / (S.N + 1));
    const coilHalfH = S.N * turnSp / 2;
    const coilLeft = coilCx - coilW / 2, coilRight = coilCx + coilW / 2;

    // Magnet
    const magnetW = 110, magnetH = Math.max(12, (S.N * turnSp * 0.7 + 20) / 3);
    const edgeMargin = 30;
    const startX = S.side === 'left' ? edgeMargin : cw - edgeMargin - magnetW;
    const endX = S.side === 'left' ? cw - edgeMargin - magnetW : edgeMargin;
    const travelDist = endX - startX;
    const speedPx = S.speed * 60; // px/s
    const travelTime = Math.abs(travelDist) / speedPx;

    if (!S.playing) {
        S.magnetX = startX;
        S.time = 0;
    }
    const mx = S.magnetX, my = coilCy;
    const magnetLeft = mx, magnetRight = mx + magnetW;
    const magnetTop = my - magnetH / 2, magnetBot = my + magnetH / 2;

    // --- Physics: dual-pole model ---
    // N and S poles separated by magnet length, each contributes a Gaussian to the flux
    const magCx = mx + magnetW / 2;
    const poleSep = magnetW * 0.8;
    const isNLeft = S.nsDir === 'N-left';
    const nPX = magCx + (isNLeft ? -poleSep / 2 : poleSep / 2);
    const sPX = magCx + (isNLeft ? poleSep / 2 : -poleSep / 2);
    const sigmaP = coilW * 0.22;
    const phiN = S.B * 3 * Math.exp(-(nPX - coilCx) * (nPX - coilCx) / (2 * sigmaP * sigmaP));
    const phiS = S.B * 3 * Math.exp(-(sPX - coilCx) * (sPX - coilCx) / (2 * sigmaP * sigmaP));
    const flux = phiN - phiS;
    const vPx = S.playing ? speedPx * (S.side === 'left' ? 1 : -1) : 0;
    const dPhiNDt = -phiN * (nPX - coilCx) / (sigmaP * sigmaP) * vPx;
    const dPhiSDt = -phiS * (sPX - coilCx) / (sigmaP * sigmaP) * vPx;
    const dFluxDt = dPhiNDt - dPhiSDt;
    const emf = -S.N * dFluxDt;
    const emfAbs = Math.abs(emf);

    // --- Draw solenoid (helical coil, horizontal, connected to galvanometer) ---
    const solCY = coilCy, solR = Math.max(coilHalfH, 24);
    const solL = coilLeft, solRr = coilRight, solLen = coilW;
    // Wave-form solenoid: sine wave along horizontal axis, N complete cycles
    const waveAmp = solR * 0.7; // wave amplitude
    const nWaves = S.N; // exactly N cycles

    // Cylinder body (subtle background)
    ctx.fillStyle = 'rgba(200,185,160,0.08)';
    ctx.fillRect(solL, solCY - solR, solLen, solR * 2);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(solL, solCY - solR); ctx.lineTo(solRr, solCY - solR); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(solL, solCY + solR); ctx.lineTo(solRr, solCY + solR); ctx.stroke();

    // Main sine wave — front-facing coil wire
    ctx.strokeStyle = '#D4956B'; ctx.lineWidth = 3.0; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i <= nWaves * 40; i++) {
        const t = i / (nWaves * 40);
        const x = solL + t * solLen;
        const y = solCY - waveAmp * Math.sin(t * nWaves * Math.PI * 2);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();



    // --- Galvanometer above coil ---
    const galvX = coilCx, galvY = coilCy - coilHalfH - 40;
    const galvR = 22;
    ctx.beginPath(); ctx.arc(galvX, galvY, galvR, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke();
    // Needle — deflects left/right based on emf sign
    const emfClamp = Math.max(Math.abs(emf), 1);
    const needleAngle = (emf / emfClamp) * Math.PI * 0.35;
    const nx = galvX + (galvR - 8) * Math.sin(needleAngle);
    const ny = galvY - (galvR - 8) * Math.cos(needleAngle);
    ctx.beginPath(); ctx.moveTo(galvX, galvY); ctx.lineTo(nx, ny);
    ctx.strokeStyle = '#FF5E5B'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();
    ctx.fillStyle = '#FF5E5B'; ctx.beginPath(); ctx.arc(galvX, galvY, 3.5, 0, Math.PI * 2); ctx.fill();
    // Galvanometer wire loop — closed circuit with solenoid
    // Left wave endpoint connects up to G left, right wave endpoint to G right
    const waveLeftY = solCY - waveAmp * Math.sin(0); // ≈ solCY
    const waveRightY = solCY - waveAmp * Math.sin(nWaves * Math.PI * 2); // ≈ solCY
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // Left: wave start → up → G left bottom edge
    ctx.beginPath(); ctx.moveTo(solL, waveLeftY);
    ctx.lineTo(solL, galvY + galvR);
    ctx.lineTo(galvX - 14, galvY + galvR); ctx.stroke();
    // Right: wave end → up → G right bottom edge
    ctx.beginPath(); ctx.moveTo(solRr, waveRightY);
    ctx.lineTo(solRr, galvY + galvR);
    ctx.lineTo(galvX + 14, galvY + galvR); ctx.stroke();
    // G label
    ctx.fillStyle = '#888'; ctx.font = '10px Fredoka'; ctx.textAlign = 'center';
    ctx.fillText('G', galvX, galvY + 4);

    // --- Draw magnet ---
    const nColor = '#e74c3c', sColor = '#3498db';
    const gradM = ctx.createLinearGradient(magnetLeft, 0, magnetRight, 0);
    gradM.addColorStop(0, isNLeft ? nColor : sColor);
    gradM.addColorStop(0.48, isNLeft ? nColor : sColor);
    gradM.addColorStop(0.52, isNLeft ? sColor : nColor);
    gradM.addColorStop(1, isNLeft ? sColor : nColor);
    ctx.fillStyle = gradM;
    const rr = 6;
    ctx.beginPath();
    ctx.moveTo(magnetLeft + rr, magnetTop);
    ctx.lineTo(magnetRight - rr, magnetTop);
    ctx.arcTo(magnetRight, magnetTop, magnetRight, magnetTop + rr, rr);
    ctx.lineTo(magnetRight, magnetBot - rr);
    ctx.arcTo(magnetRight, magnetBot, magnetRight - rr, magnetBot, rr);
    ctx.lineTo(magnetLeft + rr, magnetBot);
    ctx.arcTo(magnetLeft, magnetBot, magnetLeft, magnetBot - rr, rr);
    ctx.lineTo(magnetLeft, magnetTop + rr);
    ctx.arcTo(magnetLeft, magnetTop, magnetLeft + rr, magnetTop, rr);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke();

    // --- Field lines: N side → arc → S side (3 above, 3 below) ---
    const nSideX = isNLeft ? mx : mx + magnetW;  // N pole on left→left edge; N on right→right edge
    const sSideX = isNLeft ? mx + magnetW : mx;  // S pole opposite edge
    const nDir = isNLeft ? -1 : 1; // N pole edge: lines go outward (left or right)
    const sDir = isNLeft ? 1 : -1; // S pole edge: lines come inward
    // Field lines start from various heights along the magnet side edges
    const edgeHeights = [0.9, 0.6, 0.3, -0.3, -0.6, -0.9]; // 3 above, 3 below, evenly spaced
    for (let i = 0; i < 6; i++) {
        const frac = edgeHeights[i];
        const sy = my + frac * magnetH * 0.45;
        const sign = frac >= 0 ? 1 : -1;
        const dist = Math.abs(frac);
        const bulge = magnetW * 0.5 * (1.5 + dist * 2); // min bulge large so inner lines also curve sharply
        const cpx = (nSideX + sSideX) / 2;
        const cpy = sy + sign * bulge * 1.2;
        ctx.strokeStyle = 'rgba(127,140,141,0.4)'; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(nSideX, sy);
        ctx.quadraticCurveTo(cpx, cpy, sSideX, sy); ctx.stroke();
        // Arrow at midpoint
        const t = 0.5;
        const ax = (1-t)*(1-t)*nSideX + 2*(1-t)*t*cpx + t*t*sSideX;
        const ay = (1-t)*(1-t)*sy + 2*(1-t)*t*cpy + t*t*sy;
        const tx2 = 2*(1-t)*(cpx-nSideX) + 2*t*(sSideX-cpx);
        const ty2 = 2*(1-t)*(cpy-sy) + 2*t*(sy-cpy);
        const ang = Math.atan2(ty2, tx2), sz2 = 5;
        ctx.fillStyle = 'rgba(127,140,141,0.45)';
        ctx.beginPath(); ctx.moveTo(ax + sz2 * Math.cos(ang), ay + sz2 * Math.sin(ang));
        ctx.lineTo(ax - sz2 * 0.5 * Math.cos(ang - 0.8), ay - sz2 * 0.5 * Math.sin(ang - 0.8));
        ctx.lineTo(ax - sz2 * 0.5 * Math.cos(ang + 0.8), ay - sz2 * 0.5 * Math.sin(ang + 0.8));
        ctx.closePath(); ctx.fill();
    }
    // Pole-end lines: 2× length + quadratic arcs (top open up, bottom open down)
    const pLen = 44;
    // N pole: right half of parabola (vertex at magnet, opening outward)
    arrow(ctx, nSideX, my, nDir * pLen, 0, 'rgba(127,140,141,0.55)', 1.6);
    for (let si = 0; si < 2; si++) {
        const sign = si === 0 ? -1 : 1;
        for (let j = 0; j < 2; j++) {
            const dy = (j + 1) * 9, sy = my + sign * dy;
            const ex = nSideX + nDir * pLen, ey = my; // converge to axis
            const cpx = nSideX + nDir * pLen * 0.4, cpy = ey + sign * (dy + pLen * 0.4);
            ctx.strokeStyle = 'rgba(127,140,141,0.38)'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(nSideX, sy); ctx.quadraticCurveTo(cpx, cpy, ex, ey); ctx.stroke();
            const t = 0.5, ax = (1-t)*(1-t)*nSideX+2*(1-t)*t*cpx+t*t*ex, ay = (1-t)*(1-t)*sy+2*(1-t)*t*cpy+t*t*ey;
            ctx.fillStyle = 'rgba(127,140,141,0.45)';
            ctx.beginPath(); ctx.moveTo(ax+4, ay); ctx.lineTo(ax-2, ay-3); ctx.lineTo(ax-2, ay+3); ctx.closePath(); ctx.fill();
        }
    }
    // S pole: right half of parabola (vertex away from magnet, converging to surface)
    arrow(ctx, sSideX + sDir * pLen, my, -sDir * pLen, 0, 'rgba(127,140,141,0.55)', 1.6);
    for (let si = 0; si < 2; si++) {
        const sign = si === 0 ? -1 : 1;
        for (let j = 0; j < 2; j++) {
            const dy = (j + 1) * 9, sy = my + sign * dy;
            const sx = sSideX + sDir * pLen;
            const cpx = sSideX + sDir * pLen * 0.6, cpy = my + sign * (dy + pLen * 0.4);
            ctx.strokeStyle = 'rgba(127,140,141,0.38)'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(sx, my); ctx.quadraticCurveTo(cpx, cpy, sSideX, sy); ctx.stroke();
            const t = 0.5, ax = (1-t)*(1-t)*sx+2*(1-t)*t*cpx+t*t*sSideX, ay = (1-t)*(1-t)*my+2*(1-t)*t*cpy+t*t*sy;
            ctx.fillStyle = 'rgba(127,140,141,0.45)';
            ctx.beginPath(); ctx.moveTo(ax+4, ay); ctx.lineTo(ax-2, ay-3); ctx.lineTo(ax-2, ay+3); ctx.closePath(); ctx.fill();
        }
    }

    // N/S labels
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Fredoka'; ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const nlX = isNLeft ? mx + magnetW * 0.2 : mx + magnetW * 0.8;
    const slX = isNLeft ? mx + magnetW * 0.8 : mx + magnetW * 0.2;
    ctx.fillText('N', nlX, my);
    ctx.fillText('S', slX, my);

    // Velocity arrow
    if (S.playing) {
        const vDir = S.side === 'left' ? 1 : -1;
        const ax = mx + magnetW / 2, ay = magnetTop - 20;
        arrow(ctx, ax, ay, vDir * 25, 0, '#27ae60', 2.5);
        ctx.fillStyle = '#27ae60'; ctx.font = 'bold 10px Fredoka'; ctx.textAlign = 'center';
        ctx.fillText('v', ax + vDir * 32, ay - 2);
    }

    // Labels
    ctx.fillStyle = '#888'; ctx.font = '11px Fredoka'; ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('线圈 (' + S.N + '匝)', coilCx, coilCy + coilHalfH + 16);

    // --- EMF vs Position graph ---
    const ew = emfC.width, eh = emfC.height;
    ctxE.clearRect(0, 0, ew, eh);
    ctxE.fillStyle = '#fdfcf8'; ctxE.fillRect(0, 0, ew, eh);
    if (ew > 10 && eh > 10) {
        const mL = 45, mR = 15, mT = 10, mB = 25;
        const pw = ew - mL - mR, ph = eh - mT - mB, midY = mT + ph / 2;
        ctxE.strokeStyle = '#ddd'; ctxE.lineWidth = 1; ctxE.setLineDash([4, 4]);
        ctxE.beginPath(); ctxE.moveTo(mL, midY); ctxE.lineTo(ew - mR, midY); ctxE.stroke();
        ctxE.setLineDash([]);

        // Compute EMF across full position range using dual-pole model
        const nPts = 200;
        let emfMax = 0.5;
        const prePts = [];
        const sp = S.side === 'left' ? 1 : -1;
        const magPoleSep = magnetW * 0.8;
        for (let i = 0; i <= nPts; i++) {
            const px = startX + (i / nPts) * travelDist;
            const mc = px + magnetW / 2;
            const nX2 = mc + (isNLeft ? -magPoleSep / 2 : magPoleSep / 2);
            const sX2 = mc + (isNLeft ? magPoleSep / 2 : -magPoleSep / 2);
            const pN = S.B * 3 * Math.exp(-(nX2 - coilCx) * (nX2 - coilCx) / (2 * sigmaP * sigmaP));
            const pS = S.B * 3 * Math.exp(-(sX2 - coilCx) * (sX2 - coilCx) / (2 * sigmaP * sigmaP));
            const dN = -pN * (nX2 - coilCx) / (sigmaP * sigmaP) * speedPx * sp;
            const dS = -pS * (sX2 - coilCx) / (sigmaP * sigmaP) * speedPx * sp;
            const e = -S.N * (dN - dS);
            prePts.push({ x: px, emf: e });
            if (Math.abs(e) > emfMax) emfMax = Math.abs(e);
        }

        emfMax = Math.max(emfMax, 1);
        const scale = (ph / 2) / emfMax;

        // Filled area
        ctxE.beginPath();
        let first = true;
        for (let i = 0; i <= nPts; i++) {
            const sx = mL + (i / nPts) * pw;
            const sy = midY - prePts[i].emf * scale;
            if (first) { ctxE.moveTo(sx, midY); ctxE.lineTo(sx, sy); first = false; }
            else ctxE.lineTo(sx, sy);
        }
        ctxE.lineTo(mL + pw, midY); ctxE.closePath();
        const gE = ctxE.createLinearGradient(0, mT, 0, mT + ph);
        gE.addColorStop(0, 'rgba(255,140,66,0.25)');
        gE.addColorStop(0.5, 'rgba(255,140,66,0.05)');
        gE.addColorStop(1, 'rgba(52,152,219,0.25)');
        ctxE.fillStyle = gE; ctxE.fill();

        // Line
        ctxE.strokeStyle = '#FF8c42'; ctxE.lineWidth = 2.5; ctxE.lineCap = 'round';
        ctxE.beginPath();
        for (let i = 0; i <= nPts; i++) {
            const sx = mL + (i / nPts) * pw;
            const sy = midY - prePts[i].emf * scale;
            if (i === 0) ctxE.moveTo(sx, sy); else ctxE.lineTo(sx, sy);
        }
        ctxE.stroke();

        // Current magnet position dot
        const xFrac = (S.magnetX - startX) / travelDist;
        const dotSx = mL + xFrac * pw;
        const dotSy = midY - emf * scale;
        ctxE.fillStyle = '#FF5E5B'; ctxE.beginPath();
        ctxE.arc(dotSx, dotSy, 4.5, 0, Math.PI * 2); ctxE.fill();
        ctxE.strokeStyle = '#fff'; ctxE.lineWidth = 1.5; ctxE.stroke();

        // Coil position marker
        const coilFrac = (coilCx - magnetW / 2 - startX) / travelDist;
        const coilSx = mL + coilFrac * pw;
        ctxE.strokeStyle = '#D4956B'; ctxE.lineWidth = 1.5; ctxE.setLineDash([3, 5]);
        ctxE.beginPath(); ctxE.moveTo(coilSx, mT); ctxE.lineTo(coilSx, mT + ph); ctxE.stroke();
        ctxE.setLineDash([]);
        ctxE.fillStyle = '#D4956B'; ctxE.font = '9px Fredoka'; ctxE.textAlign = 'center';
        ctxE.fillText('线圈', coilSx, mT + ph + 14);

        // Axis labels
        ctxE.fillStyle = '#888'; ctxE.font = '9px Fredoka'; ctxE.textAlign = 'right';
        ctxE.fillText('+' + emfMax.toFixed(0) + 'mV', mL - 4, mT + 10);
        ctxE.fillText('0', mL - 4, midY + 4);
        ctxE.fillText('-' + emfMax.toFixed(0) + 'mV', mL - 4, mT + ph);
        ctxE.textAlign = 'center';
        ctxE.fillText('磁铁位置 Magnet Position', ew / 2, eh - 4);
    }

    // --- Update UI ---
    bSpeed.textContent = S.speed; bN.textContent = S.N; bB.textContent = S.B;
    fRoot.innerHTML =
        '<span class="formula-item" style="color:#8e44ad"><b>ε = −N dΦ/dt</b></span>' +
        '<span class="formula-item" style="color:#3498db">Φ = BA (磁通量)</span>' +
        '<span class="formula-item" style="color:var(--primary)">|ε_max| ≈ ' + (S.N * S.B * S.speed * 0.8).toFixed(1) + ' mV</span>';
    rRow.innerHTML =
        '<span>当前 ε = <b style="color:' + (emf > 0 ? '#e67e22' : '#2980b9') + '">' + emf.toFixed(1) + ' mV</b></span>' +
        '<span>|ε_max| ≈ <b style="color:#e74c3c">' + (emfAbs).toFixed(1) + ' mV</b></span>';
}

function loop(ts) {
    if (!lt) lt = ts;
    let dt = (ts - lt) / 1000; lt = ts;
    if (dt > 0.1) dt = 0.016;
    if (S.playing) {
        S.time += dt;
        const edgeMargin = 40;
        const cw = simC.width;
        const magnetW = 110;
        const startX = S.side === 'left' ? edgeMargin : cw - edgeMargin - magnetW;
        const endX = S.side === 'left' ? cw - edgeMargin - magnetW : edgeMargin;
        const travelDist = endX - startX;
        const speedPx = S.speed * 60;
        const travelTime = Math.abs(travelDist) / speedPx;
        const frac = Math.min(1, S.time / travelTime);
        S.magnetX = startX + frac * travelDist;
        if (frac >= 1) { S.playing = false; bStart.textContent = '开始 Start'; bStart.className = 'ctrl-btn start'; }
    }
    draw();
    requestAnimationFrame(loop);
}

function onChg() {
    S.speed = parseInt(sSpeed.value);
    S.N = parseInt(sN.value);
    S.B = parseInt(sB.value);
    const edgeMargin = 40;
    const startX = S.side === 'left' ? edgeMargin : simC.width - edgeMargin - 110;
    S.magnetX = startX; S.time = 0; lt = 0; EMF_POS.length = 0;
    draw();
}
sSpeed.addEventListener('input', onChg);
sN.addEventListener('input', onChg);
sB.addEventListener('input', onChg);

bStart.onclick = () => {
    if (!S.playing) {
        const edgeMargin = 40;
        const startX = S.side === 'left' ? edgeMargin : simC.width - edgeMargin - 110;
        S.magnetX = startX; S.time = 0; lt = 0;
    }
    S.playing = !S.playing;
    bStart.textContent = S.playing ? '暂停 Pause' : '开始 Start';
    bStart.className = 'ctrl-btn ' + (S.playing ? 'pause' : 'start');
};

bReset.onclick = () => {
    const edgeMargin = 40;
    const startX = S.side === 'left' ? edgeMargin : simC.width - edgeMargin - 110;
    S.magnetX = startX; S.time = 0; S.playing = false; lt = 0; EMF_POS.length = 0;
    bStart.textContent = '开始 Start'; bStart.className = 'ctrl-btn start';
    draw();
};

resize(); draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
