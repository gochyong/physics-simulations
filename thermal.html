<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热学 / Thermal Physics - Wuli布雷克</title>
    <style>
        :root {
            --bg-color: #fffaf5;
            --primary-warm: #ff9800;
            --accent-warm: #f57c00;
            --text-main: #3e2723;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 1000;
            text-decoration: none;
            color: var(--accent-warm);
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(245, 124, 0, 0.15);
            transition: all 0.3s ease;
        }
        .back-link:hover {
            background: #fff;
            box-shadow: 0 4px 20px rgba(245, 124, 0, 0.3);
            transform: translateX(-3px);
        }

        /* Header */
        header {
            width: 100%;
            padding: 40px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-main {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-warm), var(--primary-warm));
            padding: 10px 25px;
            border-radius: 15px 15px 15px 0;
            box-shadow: 5px 5px 20px rgba(245, 124, 0, 0.2);
        }

        .logo-sub {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--accent-warm);
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .page-subtitle {
            font-size: 1rem;
            color: #795548;
            opacity: 0.8;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Placeholder Container */
        .placeholder-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            width: 90%;
            max-width: 1100px;
            padding: 40px 0 50px;
        }

        .placeholder-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 2px solid #fff5eb;
            position: relative;
            overflow: hidden;
        }
        .placeholder-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, var(--accent-warm), var(--primary-warm));
            border-radius: 0 0 4px 4px;
        }

        .placeholder-emoji {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 24px;
        }

        .placeholder-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .placeholder-subtext {
            font-size: 1rem;
            color: #8d6e63;
            font-weight: 500;
            margin-bottom: 24px;
        }

        /* Tag */
        .tag {
            display: inline-block;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            color: var(--accent-warm);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 1px;
        }

        footer {
            margin-top: auto;
            padding: 40px;
            font-size: 0.85rem;
            color: #a1887f;
        }

        @media (max-width: 800px) {
            .placeholder-card {
                padding: 40px 40px;
            }
            .placeholder-emoji {
                font-size: 4rem;
            }
            .placeholder-text {
                font-size: 1.1rem;
            }
        }
        @media (max-width: 480px) {
            .placeholder-card {
                padding: 30px 24px;
            }
            .placeholder-emoji {
                font-size: 3rem;
            }
            .placeholder-text {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Back link -->
    <a href="index.html" class="back-link">← 返回首页</a>

    <!-- Header -->
    <header>
        <div class="brand-logo">
            <div class="logo-main">Wuli布雷克</div>
            <div class="logo-sub">Physics Simulation Lab</div>
        </div>
        <div class="page-title">热学 / Thermal Physics</div>
        <div class="page-subtitle">开发中</div>
    </header>

    <!-- Placeholder Card -->
    <main class="placeholder-container">
        <div class="placeholder-card">
            <div class="placeholder-emoji">🔥</div>
            <div class="placeholder-text">内容开发中，敬请期待</div>
            <div class="placeholder-subtext">New simulations coming soon.</div>
            <span class="tag">热学 / Thermal Physics</span>
        </div>
    </main>

    <footer>
        © 2025 Wuli布雷克 | 由 HTML5 & CSS3 驱动
    </footer>

</body>

</html>
