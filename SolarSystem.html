<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>太阳系模型 / Solar System Model - Wuli布雷克</title><link rel="stylesheet" href="common.css"><meta name="author" content="Wuli布雷克"><meta name="copyright" content="Copyright 2025 Wuli布雷克"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet"><style>:root{--bg-color:#FFF9F0;--primary:#FF8c42;--accent:#FF5E5B;--text-dark:#4A403A;--shadow:0 6px 30px rgba(255,140,66,0.18)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Fredoka','Noto Sans SC',sans-serif;background:var(--bg-color);color:var(--text-dark);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:5px 40px 10px}.container{width:100%;max-width:1400px;margin-top:8px;display:grid;grid-template-areas:"header header""formula formula""diagram controls";grid-template-columns:1fr 400px;gap:12px}header{grid-area:header;text-align:center}h1{font-size:2rem}.formula-display{grid-area:formula;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px 20px;display:flex;flex-direction:column;align-items:center;border:2px solid #fff5eb}.formula-container{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:44px}.result-row{font-size:.95rem;font-weight:600;margin-top:4px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}.diagram-section{grid-area:diagram;background:#1a1a2e;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-height:440px;display:flex;flex-direction:column;border:2px solid #fff5eb}#simCanvas{width:100%;flex:1;display:block}.controls-section{grid-area:controls;display:flex;flex-direction:column;gap:10px}.control-panel{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px}.control-group{display:flex;flex-direction:column;gap:3px}.label-row{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem}.val-badge{background:#fff;padding:1px 7px;border-radius:7px;font-size:.85rem;border:2px solid #f0f0f0}input[type=range]{width:100%;appearance:none;height:6px;background:#eee;border-radius:3px}input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer}.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ctrl-btn{padding:10px;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff}.start{background:var(--primary)}.pause{background:#2ecc71}.reset{background:#95a5a6}.info-card{background:#fff;border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);font-size:.9rem;line-height:1.4;color:#5D6D7E}@media(max-width:1100px){.container{grid-template-areas:"header""formula""diagram""controls";grid-template-columns:1fr}}</style></head><body>

<div class="container"><header><h1>太阳系模型 / Solar System Model</h1></header>
<section class="formula-display"><div class="formula-container" id="formula-root"></div></section>
<section class="diagram-section"><canvas id="simCanvas"></canvas></section>
<section class="controls-section"><div class="control-panel">
<div class="control-group"><div class="label-row"><span>时间流速</span><span id="badge-speed" class="val-badge">1x</span></div><input type="range" id="slider-speed" min="0.5" max="5" step="0.5" value="1"></div>
<div class="btn-row"><button id="btn-start" class="ctrl-btn start">开始 Start</button><button id="btn-reset" class="ctrl-btn reset">重置 Reset</button></div></div>
<div class="info-card"><div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:1.1rem">演示要点 / Key Points</div><div style="display:flex;flex-direction:column;gap:6px"><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,140,66,0.1);color:var(--primary);font-weight:700">☀</div><div><div style="font-weight:700;font-size:.9rem">八大行星绕太阳公转</div><div style="font-size:.78rem;color:#888">水金地火木土天海，近太阳公转快，远太阳公转慢。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(52,152,219,0.1);color:#3498db;font-weight:700">T</div><div><div style="font-weight:700;font-size:.9rem">开普勒第三定律 T²∝a³</div><div style="font-size:.78rem;color:#888">轨道半径越大公转周期越长。T²/a³对所有行星近似常数。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(46,204,113,0.1);color:#2ecc71;font-weight:700">⊕</div><div><div style="font-weight:700;font-size:.9rem">类地行星 vs 类木行星</div><div style="font-size:.78rem;color:#888">内四颗岩石行星小而密，外四颗气态巨行星大而疏。</div></div></div><div style="background:#fff;padding:8px 10px;border:1px solid #eee;border-radius:12px;display:grid;grid-template-columns:36px 1fr;gap:8px"><div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(230,126,34,0.1);color:#e67e22;font-weight:700">G</div><div><div style="font-weight:700;font-size:.9rem">万有引力提供向心力</div><div style="font-size:.78rem;color:#888">GMm/r²=mv²/r，太阳质量占太阳系总质量的99.86%。</div></div></div></div></div></section></div>
<script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');const sSpeed=document.getElementById('slider-speed');const bSpeed=document.getElementById('badge-speed');const resPlanet=document.getElementById('res-planet'),resPeriod=document.getElementById('res-period');const fRoot=document.getElementById('formula-root');
const planets=[{name:'水星',en:'Mercury',color:'#b0b0b0',r:28,period:0.24,size:2.5},{name:'金星',en:'Venus',color:'#f5c842',r:40,period:0.62,size:4},{name:'地球',en:'Earth',color:'#3498db',r:55,period:1.0,size:4.5},{name:'火星',en:'Mars',color:'#e74c3c',r:70,period:1.88,size:3},{name:'木星',en:'Jupiter',color:'#e8c090',r:100,period:11.86,size:12},{name:'土星',en:'Saturn',color:'#f0d890',r:125,period:29.46,size:10},{name:'天王星',en:'Uranus',color:'#7ec8e3',r:155,period:84.01,size:6},{name:'海王星',en:'Neptune',color:'#4169e1',r:175,period:164.8,size:6}];
const S={playing:false,speed:1,time:0};
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}window.addEventListener('resize',resize);
function update(){S.speed=parseFloat(sSpeed.value);bSpeed.textContent=S.speed+'x';const dt=0.016;if(S.playing)S.time+=dt*S.speed;fRoot.innerHTML='☀ Sun&nbsp;|&nbsp;'+planets.map(p=>'<span style="color:'+p.color+'">●</span> '+p.name+'/'+p.en).join('&nbsp;|&nbsp;');draw();requestAnimationFrame(update)}
function draw(){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,w,h);for(let i=0;i<30;i++){ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.5)+')';ctx.fillRect(Math.random()*w,Math.random()*h,1.2,1.2)}const cx=w*0.48,cy=h*0.52;
ctx.fillStyle='#ffdd57';const sunR=18;ctx.beginPath();ctx.arc(cx,cy,sunR,0,Math.PI*2);ctx.fill();const sunGlow=ctx.createRadialGradient(cx,cy,sunR*0.5,cx,cy,sunR*3);sunGlow.addColorStop(0,'rgba(255,255,150,0.5)');sunGlow.addColorStop(1,'rgba(255,150,50,0)');ctx.fillStyle=sunGlow;ctx.beginPath();ctx.arc(cx,cy,sunR*3,0,Math.PI*2);ctx.fill();
planets.forEach(p=>{const ang=(S.time*2*Math.PI)/p.period;const px=cx+p.r*Math.cos(ang),py=cy+p.r*Math.sin(ang);ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;ctx.beginPath();ctx.arc(cx,cy,p.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(px,py,p.size,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 8px Fredoka';ctx.textAlign='center';ctx.fillText(p.name,px,py-p.size-5)});
ctx.fillStyle='#fff';ctx.font='bold 10px Fredoka';ctx.fillText('Sun',cx,cy+sunR+12);ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px Fredoka';ctx.textAlign='right';ctx.fillText('t='+S.time.toFixed(1)+'年',w-10,20)}
document.getElementById('btn-start').onclick=()=>{S.playing=!S.playing;const b=document.getElementById('btn-start');b.textContent=S.playing?'暂停 Pause':'开始 Start';b.classList.toggle('start',!S.playing);b.classList.toggle('pause',S.playing)};
document.getElementById('btn-reset').onclick=()=>{S.time=0;S.playing=false;document.getElementById('btn-start').textContent='开始 Start';document.getElementById('btn-start').className='ctrl-btn start'};
resize();requestAnimationFrame(update);
</script><div class="site-footer">© 2025 Wuli布雷克 | MIT License </div></body></html>
