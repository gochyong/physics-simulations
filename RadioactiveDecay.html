<script>
const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');
const sN0=document.getElementById('slider-n0'),sHalf=document.getElementById('slider-half');
const bN0=document.getElementById('badge-n0'),bHalf=document.getElementById('badge-half');
const resN=document.getElementById('res-n'),resHalf=document.getElementById('res-half'),resT=document.getElementById('res-t');
const fRoot=document.getElementById('formula-root');
const S={n0:1000,halfLife:5,time:0,playing:false,nuclei:[],history:[]};
function initNuclei(){
    S.nuclei=[];S.history=[];
    const lambda=Math.log(2)/S.halfLife;
    for(let i=0;i<S.n0;i++){
        // Exponential distribution: decayTime = -ln(U)/λ
        S.nuclei.push({decayed:false,decayTime:-Math.log(Math.max(1e-9,Math.random()))/lambda});
    }
}
initNuclei();
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;}
window.addEventListener('resize',resize);
let lastTs=0;
function update(ts){
    const newN0=parseInt(sN0.value);
    const newHalf=parseFloat(sHalf.value);
    if(newHalf!==S.halfLife){
        S.time=0;S.halfLife=newHalf;initNuclei();S.playing=false;
        document.getElementById('btn-start').textContent='开始 Start';
        document.getElementById('btn-start').className='ctrl-btn start';
    }
    if(newN0!==S.n0){
        S.n0=newN0;S.time=0;initNuclei();S.playing=false;
        document.getElementById('btn-start').textContent='开始 Start';
        document.getElementById('btn-start').className='ctrl-btn start';
    }
    S.n0=newN0;S.halfLife=newHalf;
    bN0.textContent=S.n0;bHalf.textContent=S.halfLife.toFixed(1)+' s';
    const lambda=Math.log(2)/S.halfLife;
    if(!lastTs)lastTs=ts;
    const dt=Math.min((ts-lastTs)/1000,0.05);
    lastTs=ts;
    if(S.playing){
        S.time+=dt;
        for(let n of S.nuclei){if(!n.decayed&&S.time>=n.decayTime){n.decayed=true;}}
        const remaining=S.nuclei.filter(n=>!n.decayed).length;
        S.history.push({t:S.time,n:remaining});
        resN.textContent=remaining;
        resT.textContent=S.time.toFixed(1);
    }
    resHalf.textContent=S.halfLife.toFixed(1);
    resN.textContent=S.playing?S.nuclei.filter(n=>!n.decayed).length:S.n0;
    resT.textContent=S.time.toFixed(1);
    fRoot.innerHTML=`<span style="font-size:24px;font-weight:700;color:var(--accent);">N</span>
        <span style="font-size:24px;">=</span>
        <span style="font-size:24px;font-weight:700;">N₀</span>
        <span style="font-size:24px;">e<sup style="font-size:0.7em;">−λt</sup></span>
        <span style="font-size:22px;">&nbsp; T½=${S.halfLife.toFixed(1)}s</span>`;
    draw();requestAnimationFrame(update);
}
function draw(){
    const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fafaf7';ctx.fillRect(0,0,w,h);
    // Decay curve graph
    const gx=w*0.08,gy=h*0.08,gw=w*0.84,gh=h*0.75;
    const lambda=Math.log(2)/S.halfLife;
    const maxT=S.halfLife*5;
    const remaining=S.playing?S.nuclei.filter(n=>!n.decayed).length:S.n0;

    // Axes
    ctx.strokeStyle='#6B6B6B';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy+gh);ctx.lineTo(gx+gw,gy+gh);ctx.stroke();
    // Y-axis label
    ctx.fillStyle='#6B6B6B';ctx.font='bold 11px ';ctx.textAlign='center';
    ctx.fillText('N',gx-4,gy-8);
    ctx.fillText('0',gx-4,gy+gh+12);
    ctx.fillText(S.n0,gx-4,gy+4);
    // X-axis label and ticks
    ctx.fillText('t',gx+gw+10,gy+gh+4);
    ctx.textAlign='center';
    for(let hl=0;hl<=5;hl++){
        const tx=gx+(hl*S.halfLife/maxT)*gw;
        if(tx>gx+gw)break;
        ctx.fillText(hl===0?'0':hl+'T½',tx,gy+gh+14);
        // tick mark
        ctx.beginPath();ctx.moveTo(tx,gy+gh);ctx.lineTo(tx,gy+gh+4);ctx.stroke();
    }

    // Theoretical curve
    ctx.beginPath();ctx.strokeStyle='#2ecc71';ctx.lineWidth=2;
    for(let i=0;i<=100;i++){
        const t=maxT*i/100;
        const n=S.n0*Math.exp(-lambda*t);
        const px=gx+(t/maxT)*gw;
        const py=gy+gh-(n/S.n0)*gh;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();

    // History data points as colored dots
    if(S.history.length>1){
        for(let i=0;i<S.history.length;i+=Math.max(1,Math.floor(S.history.length/200))){
            const h=S.history[i];
            const px=gx+(h.t/maxT)*gw;
            const py=gy+gh-(h.n/S.n0)*gh;
            ctx.fillStyle='var(--accent)';ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill();
        }
    }

    // Half-life markers with y-values
    for(let hl=1;hl<=4;hl++){
        const tx=gx+(hl*S.halfLife/maxT)*gw;
        if(tx>gx+gw)break;
        const nAtHL=S.n0*Math.exp(-lambda*hl*S.halfLife);
        const ny=gy+gh-(nAtHL/S.n0)*gh;
        ctx.strokeStyle='#9b59b6';ctx.setLineDash([3,3]);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(tx,gy);ctx.lineTo(tx,gy+gh);ctx.stroke();
        ctx.setLineDash([]);
        // Y value at this half-life
        ctx.fillStyle='#9b59b6';ctx.font='bold 10px ';ctx.textAlign='left';
        ctx.fillText('N≈'+Math.round(nAtHL),tx+2,ny-2);
    }

}
function resetSim(){S.time=0;S.history=[];initNuclei();S.playing=false;document.getElementById('btn-start').textContent='开始 Start';document.getElementById('btn-start').className='ctrl-btn start';}
document.getElementById('btn-start').onclick=()=>{if(!S.playing&&S.time===0)initNuclei();S.playing=!S.playing;const b=document.getElementById('btn-start');b.textContent=S.playing?'暂停 Pause':'开始 Start';b.classList.toggle('start',!S.playing);b.classList.toggle('pause',S.playing);};
document.getElementById('btn-reset').onclick=resetSim;
resize();requestAnimationFrame(update);

document.addEventListener('keydown',(e)=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  const startBtn=document.getElementById('btn-start');
  const resetBtn=document.getElementById('btn-reset');
  if(e.code==='Space'){e.preventDefault();startBtn&&startBtn.click();}
  else if(e.code==='KeyR'){e.preventDefault();resetBtn&&resetBtn.click();}
});

document.addEventListener('keydown',(e)=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  const startBtn=document.getElementById('btn-start');
  const resetBtn=document.getElementById('btn-reset');
  if(e.code==='Space'){e.preventDefault();startBtn&&startBtn.click();}
  else if(e.code==='KeyR'){e.preventDefault();resetBtn&&resetBtn.click();}

</script>
