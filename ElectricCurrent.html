<style>        :root {
    --primary-warm: #ff9800;
    --accent-warm: #f57c00;
    --text-main: #3e2723;
        }
/* Back link */
        .back-link {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 1000;
            text-decoration: none;
            color: var(--accent-warm);
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(245, 124, 0, 0.15);
            transition: all 0.3s ease;
        }
.back-link:hover {
            background: #fff;
            box-shadow: 0 4px 20px rgba(245, 124, 0, 0.3);
            transform: translateX(-3px);
        }
/* Header */
        header {
            width: 100%;
            padding: 40px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
.page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 2px;
            margin-top: 10px;
        }
.page-subtitle {
            font-size: 1rem;
            color: #795548;
            opacity: 0.8;
            margin-top: 4px;
            font-weight: 500;
        }
/* Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 90%;
            max-width: 800px;
            padding: 20px 0 50px;
        }
/* Sim Card */
        .sim-card {
            text-decoration: none;
            color: var(--text-main);
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px 24px 22px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 2px solid #fff5eb;
            position: relative;
            overflow: hidden;
        }
.sim-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, var(--accent-warm), var(--primary-warm));
            border-radius: 0 0 4px 4px;
        }
.sim-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 45px rgba(245, 124, 0, 0.18);
            border-color: #ffe0c0;
        }
.sim-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            width: 100%;
        }
.sim-card-icon {
            font-size: 1.6rem;
            line-height: 1;
        }
.sim-card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }
.sim-card-subtitle {
            font-size: 0.85rem;
            color: #8d6e63;
            font-weight: 500;
        }
.sim-card-desc {
            font-size: 0.88rem;
            color: #6d4c41;
            line-height: 1.5;
            margin-bottom: 12px;
            flex: 1;
        }
/* Tag */
        .tag {
            display: inline-block;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            color: var(--accent-warm);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 1px;
        }
footer {
            margin-top: auto;
            padding: 40px;
            font-size: 0.85rem;
            color: #a1887f;
        }
@media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .sim-card {
                padding: 22px 18px 18px;
            }
            .sim-card-title {
                font-size: 1rem;
            }
        }
/* === 无障碍 Accessibility (批量注入) === */
.skip-link { position: absolute; top: -40px; left: 8px; z-index: 2000; background: #185FA5; color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: top 0.2s; }
.skip-link:focus { top: 8px; }
:focus-visible { outline: 3px solid #185FA5; outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>

    <header>
        <div class="page-title">电流 / Electric Current</div>

    <!-- Sim Card Grid -->
    <main class="grid-container" id="main">

        <!-- 1. 电流定义式 / Current Definition -->
        <a href="CurrentDefinition.html" class="sim-card" aria-label="访问电流定义式">
            <div class="sim-card-header">
                <span class="sim-card-icon" aria-hidden="true">⚡</span>
                <div>
                    <div class="sim-card-title">电流定义式</div>
                    <div class="sim-card-subtitle">Current Definition: I = Q/t</div>
                </div>
            </div>
            <div class="sim-card-desc">电流等于单位时间内通过导体横截面的电荷量。调节电荷量和时间，观察电荷在导体中的运动。</div>
            <span class="tag">电磁学 / Electromagnetism</span>
        </a>

        <!-- 2. 电流微观表达式 / Microscopic Current -->
        <a href="MicroscopicCurrent.html" class="sim-card" aria-label="访问电流微观表达式">
            <div class="sim-card-header">
                <span class="sim-card-icon" aria-hidden="true">🔬</span>
                <div>
                    <div class="sim-card-title">电流微观表达式</div>
                    <div class="sim-card-subtitle">Microscopic: I = nqvS</div>
                </div>
            </div>
            <div class="sim-card-desc">电流由载流子密度、漂移速度和截面积共同决定。调节 n、v、S 观察自由电子定向运动形成电流。</div>
            <span class="tag">电磁学 / Electromagnetism</span>
        </a>

    </main>
